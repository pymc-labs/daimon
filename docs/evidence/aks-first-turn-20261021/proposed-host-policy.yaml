# Proposal only: not applied. Current AKS has no egress policy on these host pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coke-daimon-host-egress
  namespace: daimon
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [coke-daimon-mcp, coke-daimon-scheduler]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector: {matchLabels: {app: coke-daimon-postgres}}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector: {matchLabels: {app: coke-daimon-mcp}}
      ports: [{protocol: TCP, port: 8765}]
    - to:
        - podSelector: {matchLabels: {app: coke-daimon-harness}}
      ports: [{protocol: TCP, port: 8088}]
