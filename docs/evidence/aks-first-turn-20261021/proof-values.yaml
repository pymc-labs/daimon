images:
  host: {tag: l15-first-turn-4}
  harness: {tag: l15-first-turn-2}
azureOpenAI:
  deployment: gpt-5.4-mini
  smokeDeployment: gpt-5.4-mini
init:
  enabled: false
host:
  runtimeSecret: l15-runtime
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1536Mi}
  env:
    DAIMON_SELFHOSTED__HARNESS_AUTH_BINDINGS: '[{"name": "DAIMON_HARNESS_TOKEN", "origin": "http://coke-daimon-harness:8088", "tenants": ["91495665-ea07-561f-b769-d05d875385e2"], "allow_insecure_http": true}]'
    DAIMON_TURN__PATH: mux
    DAIMON_TURN__CHANNEL_BACKENDS: 'true'
    DAIMON_SELFHOSTED__ADMISSION_ENABLED: 'true'
    DAIMON_MCP__PUBLIC_URL: http://coke-daimon-mcp:8765/mcp
    DAIMON_SELFHOSTED__MCP_ALLOWED_HTTP_HOSTS: '["coke-daimon-mcp"]'
    DAIMON_TURN__PROVIDER_RUNTIME_FILE: /etc/daimon-runtime/runtime.json
    DAIMON_BILLING__SELFHOSTED__DEPLOYMENTS: '{"gpt-5.4-mini":"gpt-5.4-mini-TEST"}'
    DAIMON_BILLING__SELFHOSTED__MODELS: '{"gpt-5.4-mini-TEST":[{"effective_from":"2026-10-21","input":"0.75","output":"4.5","cache_read":"0.075"}]}'
harness:
  env:
    HARNESS_ALLOW_INSECURE_DAIMON_MCP: 'true'
    HARNESS_DAIMON_MCP_URL: http://coke-daimon-mcp:8765/mcp
