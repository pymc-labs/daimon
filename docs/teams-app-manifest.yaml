# Teams app registration for a daimon deployment.
#
# The full walkthrough, portal by portal, with troubleshooting, is in
# docs/self-hosting.md under "Microsoft Teams (optional)". Below is the short
# version.
#
# Teams has no manifest-paste equivalent of Slack's app creator that also
# provisions the Entra side, so registration is two artifacts: an Entra app
# registration (what the adapter authenticates as) and a Teams app package
# (a zip with manifest.json + icons, installed by a user or admin).
#
# 1. Entra portal → App registrations → New registration:
#      - Accounts in this organizational directory only (single tenant).
#      - Certificates & secrets → New client secret → DAIMON_TEAMS__CLIENT_SECRET.
#      - Application (client) ID → DAIMON_TEAMS__CLIENT_ID.
#      - Directory (tenant) ID → DAIMON_TEAMS__TENANT_ID.
#    No API permissions are required: the bot calls the Bot Framework REST
#    API, which authorizes on the app registration itself, and reads channel
#    messages through Microsoft Graph under the resource-specific consent
#    below, which a team owner grants when installing the app in a team
#    (group chats: a chat member, when adding the app to the chat).
#    Channel files optionally need the Graph application permission
#    Files.ReadWrite.All with admin consent (docs/teams.md), and
#    DAIMON_PRIVATE_CHANNEL_MESSAGES__ENABLED the tenant-wide Graph
#    application permission ChannelMessage.Read.All with admin consent;
#    this manifest stays the same either way.
# 2. Azure portal → Create a resource → Azure Bot:
#      - Type of App: Single Tenant; point it at the registration above.
#      - Configuration → Messaging endpoint:
#          https://DAIMON_HOST/api/messages
#        DAIMON_HOST must be a public HTTPS host that reaches the adapter's
#        listener (DAIMON_TEAMS__PORT, default 3978) — a tunnel or reverse
#        proxy in front of the `teams` compose service.
#      - Channels → add Microsoft Teams.
# 3. Build the Teams app package from the manifest below: manifest.json,
#    color.png (192×192) and outline.png (32×32, white on transparent),
#    zipped at the top level. Then upload it in the Teams admin center or
#    sideload it.
#
# The adapter provisions the tenant for DAIMON_TEAMS__TENANT_ID at boot; there
# is no install flow. The bot answers in 1:1 chat, and when @mentioned in a
# channel or group chat, replaying the thread or chat it is in. A group chat
# is answered only while everyone in it is from this organisation.
#
# Commands and prompt starters: `supportsTargetedMessages` lets people send
# the bot a message only it sees, which slash commands need. A channel or
# group chat command, typed with / or after a mention, is answered for its
# sender only. Prompt
# starters are fixed text: Teams lists them in the 1:1 chat ("View prompts")
# and after an @mention in a channel. A list holds at most 12 commands, and
# the bot at most 3 lists.
#
# Private and shared channels: `supportsChannelFeatures: tier1` lets the app
# be added to them (manifest 1.25 or later; never `supportedChannelTypes`,
# which blocks the upload there). Installing the app in a team does not add
# it to these channels: each one's owner adds it from the channel itself.

manifestVersion: "1.30"
id: "${DAIMON_TEAMS__CLIENT_ID}"        # must equal the Entra app id
version: "0.6.2"                       # bump on every change, then re-upload
supportsChannelFeatures: tier1          # private and shared channels (see above)
developer:
  name: daimon
  websiteUrl: https://DAIMON_HOST
  privacyUrl: https://github.com/pymc-labs/daimon/blob/main/PRIVACY.md  # or DAIMON_PRIVACY_POLICY_URL
  termsOfUseUrl: https://DAIMON_HOST/terms  # your own terms page; daimon serves none
name:
  short: daimon
  full: daimon
description:
  short: Data-science agent that writes and runs code, fits models, and answers in chat.
  full: Data-science agent that writes and runs code, fits models, and delivers answers in a chat or channel thread.
icons:
  outline: outline.png
  color: color.png
accentColor: "#0b110e"
bots:
  - botId: "${DAIMON_TEAMS__CLIENT_ID}"
    scopes:
      - personal
      - team                            # channels: answers when @mentioned
      - groupChat                       # group chats: answers when @mentioned
    supportsTargetedMessages: true      # slash commands and private replies
    commandLists:
      - scopes:
          - personal
        commands:
          - title: help
            description: This list
          - title: new
            description: Start a fresh conversation
          - title: setup
            description: Your agents and where they answer
          - title: here
            description: Who answers here and what it can use
          - title: routines
            description: Scheduled jobs
          - title: memory
            description: What the agent remembers
          - title: privacy
            description: See, export or delete your data
          - title: billing
            description: Your usage and credit
          - title: support                 # answered only when human support is configured
            description: Ask a person
          - title: Explore a dataset
            description: Load a file, check it and report what it shows.
            type: prompt
            prompt: >-
              I'll attach a data file. Load it, check whether it's fit to analyse,
              explore it, and tell me the main findings with charts.
          - title: Build a notebook
            description: An interactive notebook for your data.
            type: prompt
            prompt: >-
              Build an interactive notebook that explores the data I describe or
              attach, and send me the link.
          - title: Set up my workspace
            description: Repo, keys, skills and routines.
            type: prompt
            prompt: >-
              Help me set up this workspace: the working repo, keys, skills and
              routines. Start with what is set up now.
      - scopes:
          - team
          - groupChat
        triggers:
          - slash
        commands:                       # answered for the sender only
          - title: help
            description: This list
          - title: here
            description: Who answers here and what it can use
          - title: memory
            description: What the agent remembers
          - title: routines
            description: Scheduled jobs
          - title: billing
            description: Your usage and credit
          - title: privacy
            description: See, export or delete your data
      - scopes:
          - team
        triggers:
          - mention
        commands:                       # posted in the thread after the mention
          - title: Summarise this thread
            description: The question, what was decided, what is open.
            type: prompt
            prompt: >-
              Summarise this thread: the question, what was decided, and the open
              items with who owns them.
          - title: Analyse the data here
            description: Check and explore the files in this thread.
            type: prompt
            prompt: >-
              Analyse the data files shared in this thread: check they're fit to
              use, explore them, and post the main findings with charts.
          - title: Write it up
            description: A short readout of the analysis in this thread.
            type: prompt
            prompt: >-
              Write up the analysis in this thread as a short readout: lead with
              the finding, then the evidence and the caveats.
    supportsFiles: true                 # files shared in 1:1 chats, file consent cards
    isNotificationOnly: false
permissions:
  - identity
  - messageTeamMembers
validDomains:
  - DAIMON_HOST                         # token.botframework.com is implicit
webApplicationInfo:
  id: "${DAIMON_TEAMS__CLIENT_ID}"
  resource: https://RscBasedStoreApp    # unused by RSC, but must be set
authorization:
  permissions:
    resourceSpecific:
      # Read the channel threads the bot is mentioned in, and their images.
      - name: ChannelMessage.Read.Group
        type: Application
      - name: TeamMember.Read.Group
        type: Application
      # Read the messages and images of the group chats the app is added to.
      - name: ChatMessage.Read.Chat
        type: Application
      # Send activity feed notices for routine results and cards waiting on
      # someone in the team's channels; without it they are only logged.
      - name: TeamsActivity.Send.Group
        type: Application
