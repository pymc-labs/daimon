name: Canary

# One tiny real turn per backend every hour, in staging and production
# (scripts/canary.py), and once more right after every promote (promote.yml
# calls this with production only). A failed turn writes an ERROR
# `daimon-canary` log entry in that environment's project, which its alert
# policy watches, and turns this run red.
#
# Each GitHub Environment supplies its own project, auth and QA ids:
# GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOY_SA, CANARY_BOT_ID and
# CANARY_CHANNELS (JSON, backend to QA channel id). Staging authenticates as its
# deploy service account and also reads each turn's outcome row over IAP.
# `production-canary` authenticates as a canary-only service account that can
# read the QA bot token and write logs, nothing else, so production is judged
# by the reply alone. Those grants live in the operator's cloud configuration,
# outside this repository.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Judge against a 0 s limit so every backend fails and the alert fires"
        type: boolean
        default: false
  workflow_call:
    inputs:
      environments:
        description: "JSON list of the GitHub Environments to run in"
        type: string
        default: '["staging", "production-canary"]'

permissions:
  contents: read

jobs:
  canary:
    name: Canary turn per backend (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environments || '["staging", "production-canary"]') }}
    environment: ${{ matrix.environment }}
    # One run per environment at a time; a promote's canary queues apart from
    # the hourly one (github.workflow is the caller's), so neither cancels the other.
    concurrency:
      group: canary-${{ github.workflow }}-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          skip_install: true

      - name: One turn per backend
        env:
          CANARY_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          CANARY_ZONE: ${{ vars.GCP_ZONE }}
          CANARY_WORKERS_VM: ${{ vars.GCP_AR_REPO }}-workers
          CANARY_BOT_ID: ${{ vars.CANARY_BOT_ID }}
          CANARY_CHANNELS: ${{ vars.CANARY_CHANNELS }}
          ENVIRONMENT: ${{ matrix.environment }}
          NO_OUTCOMES: ${{ matrix.environment != 'staging' && '--no-outcomes' || '' }}
          FORCE_FAIL: ${{ inputs.force_fail && '--force-fail' || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/canary.py --env "$ENVIRONMENT" --run-url "$RUN_URL" $NO_OUTCOMES $FORCE_FAIL

      # The script reports each backend itself; this catches a run that died
      # before it could (or whose own log write failed), so the alert still fires.
      - name: Alert on a run that could not report
        if: failure()
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gcloud logging write daimon-canary \
            "{\"event\": \"canary.turn\", \"env\": \"$ENVIRONMENT\", \"backend\": \"all\", \"problem\": \"the canary run failed\", \"run_url\": \"$RUN_URL\"}" \
            --payload-type=json --severity=ERROR --project="$PROJECT"
