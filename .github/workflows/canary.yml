name: Staging canary

# One tiny real turn per staging backend every hour (scripts/staging_canary.py).
# Staging only: there is no production job and no production input. A failed
# turn writes an ERROR `daimon-canary` log entry, which the staging alert policy
# "staging-daimon: canary turn failed" watches, and turns this run red.
#
# The deploy service account needs secretAccessor on DISCORD_QA_BOT_TOKEN and
# log writing in the staging project; both grants live in the operator's cloud
# configuration, outside this repository, like the contract workflow's.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Judge against a 0 s limit so every backend fails and the alert fires"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Canary turn per backend (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          skip_install: true

      - name: One turn per backend
        env:
          FORCE_FAIL: ${{ inputs.force_fail && '--force-fail' || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/staging_canary.py --run-url "$RUN_URL" $FORCE_FAIL

      # The script reports each backend itself; this catches a run that died
      # before it could (or whose own log write failed), so the alert still fires.
      - name: Alert on a run that could not report
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gcloud logging write daimon-canary \
            "{\"event\": \"canary.turn\", \"env\": \"staging\", \"backend\": \"all\", \"problem\": \"the canary run failed\", \"run_url\": \"$RUN_URL\"}" \
            --payload-type=json --severity=ERROR --project=pymc-daimon-staging
