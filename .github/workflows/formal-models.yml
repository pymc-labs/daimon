name: Formal models

# Model-checks every TLA+ config in formal/expected.tsv with TLC and compares
# the verdict and the distinct-state count (formal/README.md): a deliberately
# unsafe config must still find its counterexample, a safe config must stay
# clean, and no config may explore 0 states. Runs on relevant PR changes and
# again at the exact main SHA after a relevant merge. The models do not read the
# code, so only changes under formal/ re-run them; formal/README.md lists which
# code each model describes. Each run checks the full registry and takes several
# minutes of TLC time on current state counts.
on:
  push:
    branches:
      - main
    paths:
      - "formal/**"
      - ".github/workflows/formal-models.yml"
  pull_request:
    paths:
      - "formal/**"
      - ".github/workflows/formal-models.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch TLC (tla2tools v1.7.4 = TLC 2.19, pinned by sha256)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
      - name: Model-check every config against formal/expected.tsv
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
        run: |
          set -o pipefail
          formal/check.sh | tee "$RUNNER_TEMP/formal-check.txt"
      - name: Summary
        if: always()
        run: |
          { echo '### Formal models'; echo '```'; cat "$RUNNER_TEMP/formal-check.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
