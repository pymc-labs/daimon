name: Formal models

# Model-checks every TLA+ config in formal/expected.tsv with TLC and compares
# the verdict and the distinct-state count (formal/README.md): a deliberately
# unsafe config must still find its counterexample, a safe config must stay
# clean, and no config may explore 0 states. Runs on relevant PR changes and
# again at the exact main SHA after a relevant merge, plus when the code a model
# describes changes. The model does not read the code. Each run checks the full
# registry and takes several minutes of TLC time on current state counts.
on:
  push:
    branches:
      - main
    paths:
      - "formal/**"
      - ".github/workflows/formal-models.yml"
      - "packages/core/daimon/core/turn/driver.py"
      - "packages/core/daimon/core/turn/reducers.py"
