  pytest-mux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras --all-packages
      - name: pytest (mux)
        run: uv run pytest packages/mux -n auto

  # Builds the three images deploy.yml ships. On a push to main it also fills
  # the build cache deploy.yml reads, while the tests run, so the deploy only
  # rebuilds what changed. Pull requests read that cache but never write it:
  # their entries would crowd main's out of the repository's cache quota. A
  # failed cache upload is ignored: it must not block the deploy needing this.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - name: daimon
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          cache-from: type=gha,scope=daimon
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=daimon,ignore-error=true' || '' }}
      - name: notebook-host
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/notebook-host/Dockerfile
          cache-from: type=gha,scope=notebook-host
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=notebook-host,ignore-error=true' || '' }}
      - name: report-host
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/report-host/Dockerfile
          cache-from: type=gha,scope=report-host
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=report-host,ignore-error=true' || '' }}

  deploy-gcp:
    name: Deploy to GCP (staging)
    needs: [lint, pytest-core, pytest-mcp, pytest-discord, pytest-slack, pytest-teams, pytest-parity, pytest-notebook-host, pytest-report-host, pytest-mux, docker-build]
    # vars.GCP_WIF_PROVIDER doubles as the deploy switch: repository variables
    # don't propagate to forks/clones, so a repo with no GCP config skips this
    # job cleanly (green CI) instead of failing at the auth step. Operators
    # enable push-to-main deploys by setting GCP_WIF_PROVIDER, GCP_DEPLOY_SA,
    # and GCP_PROJECT_ID in repo settings — no workflow edit needed. Partial
    # config (provider set, SA/project missing) fails loudly by design.
    #
    # A push to main deploys STAGING. Production deploys only through
    # promote.yml (workflow_dispatch behind the production reviewer gate).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_WIF_PROVIDER != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      sha: ${{ github.sha }}
