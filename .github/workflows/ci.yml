name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Reusable Postgres service block + shared bootstrap (checkout, uv sync,
# alembic upgrade) are duplicated across pytest-* jobs by necessity —
# GitHub Actions doesn't support YAML anchors. The suites are split across
# parallel jobs rather than run as one: together they take longer than a
# reviewer should wait, and a split run names the failing area in the job
# list instead of somewhere inside a single long log.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Silences pyright-python's "newer version available" nag in the log.
      PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras --all-packages

      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: pyright
        run: uv run pyright

      - name: import-linter
        run: uv run lint-imports

      - name: lint discord modals
        run: uv run python scripts/lint_discord_modals.py

      - name: lint test anti-patterns
        run: bash scripts/lint_anti_patterns.sh

      - name: lint migrations
        run: uv run python scripts/lint_migrations.py

      - name: lint private material leakage
        run: bash scripts/lint_designators.sh

      - name: env example check
        run: uv run python scripts/generate_env_example.py --check

      - name: config reference check
        run: uv run python scripts/generate_config_reference.py --check

      - name: mcp tool catalogue check
        run: uv run python scripts/generate_mcp_tool_catalogue.py --check

      - uses: actions/cache@v4
        with:
          path: ~/.cache/daimon-web
          key: tailwindcss-v4.3.3-linux-x64-dc61b3ac6b8c9ca8

      - name: web CSS check
        run: uv run python scripts/generate_web_css.py --check

  # Core and MCP exercise thousands of short-lived test schemas. PG18 keeps
  # PGDATA under /var/lib/postgresql; the bounded tmpfs avoids runner disk I/O
  # while leaving PostgreSQL's transaction and WAL settings unchanged.
  pytest-core:
    name: pytest-core (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: daimon
          POSTGRES_PASSWORD: daimon
          POSTGRES_DB: daimon
        ports: ["5432:5432"]
        options: >-
          --tmpfs /var/lib/postgresql:rw,noexec,nosuid,size=2g
          --health-cmd="pg_isready -U daimon"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DAIMON_DATABASE__URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon
      DAIMON_DATABASE__TEST_URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Credential equivalence tests import the fixed base commit.
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras --all-packages
      - name: Create daimon_test database
        env:
          PGPASSWORD: daimon
        run: psql -h localhost -U daimon -d daimon -v ON_ERROR_STOP=1 -c "CREATE DATABASE daimon_test;"
      - name: alembic upgrade (test DB)
        env:
          DAIMON_DATABASE_URL: ${{ env.DAIMON_DATABASE__TEST_URL }}
        run: uv run alembic upgrade head
      - name: pytest (core + cli + scheduler + testing + integration)
        run: >-
          uv run pytest qa/live/tests packages/core packages/adapters/cli
          packages/adapters/scheduler packages/testing tests/integration
          tests/test_deploy_workflow_quotes.py tests/test_ci_workflow_contract.py -n auto
          -p daimon.testing.ci_shard --ci-shard-index=${{ matrix.shard }}
          --ci-shard-count=3 --durations=20
          --junitxml=core-shard-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-shard-${{ matrix.shard }}-junit
          path: core-shard-${{ matrix.shard }}.xml
          if-no-files-found: ignore

  pytest-mcp:
    name: pytest-mcp (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: daimon
          POSTGRES_PASSWORD: daimon
          POSTGRES_DB: daimon
        ports: ["5432:5432"]
        options: >-
          --tmpfs /var/lib/postgresql:rw,noexec,nosuid,size=2g
          --health-cmd="pg_isready -U daimon"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DAIMON_DATABASE__URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon
      DAIMON_DATABASE__TEST_URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras --all-packages
      - name: Create daimon_test database
        env:
          PGPASSWORD: daimon
        run: psql -h localhost -U daimon -d daimon -v ON_ERROR_STOP=1 -c "CREATE DATABASE daimon_test;"
      - name: alembic upgrade (test DB)
        env:
          DAIMON_DATABASE_URL: ${{ env.DAIMON_DATABASE__TEST_URL }}
        run: uv run alembic upgrade head
      - name: pytest (mcp)
        run: >-
          uv run pytest packages/adapters/mcp -n auto
          -p daimon.testing.ci_shard --ci-shard-index=${{ matrix.shard }}
          --ci-shard-count=2 --durations=20
          --junitxml=mcp-shard-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-shard-${{ matrix.shard }}-junit
          path: mcp-shard-${{ matrix.shard }}.xml
          if-no-files-found: ignore

  pytest-discord:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: daimon
          POSTGRES_PASSWORD: daimon
          POSTGRES_DB: daimon
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U daimon"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DAIMON_DATABASE__URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon
      DAIMON_DATABASE__TEST_URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras --all-packages
      - name: Create daimon_test database
        env:
          PGPASSWORD: daimon
        run: psql -h localhost -U daimon -d daimon -v ON_ERROR_STOP=1 -c "CREATE DATABASE daimon_test;"
      - name: alembic upgrade (test DB)
        env:
          DAIMON_DATABASE_URL: ${{ env.DAIMON_DATABASE__TEST_URL }}
        run: uv run alembic upgrade head
      - name: pytest (discord)
        run: uv run pytest packages/adapters/discord -n auto

  pytest-slack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: daimon
          POSTGRES_PASSWORD: daimon
          POSTGRES_DB: daimon
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U daimon"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DAIMON_DATABASE__URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon
      DAIMON_DATABASE__TEST_URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras --all-packages
      - name: Create daimon_test database
        env:
          PGPASSWORD: daimon
        run: psql -h localhost -U daimon -d daimon -v ON_ERROR_STOP=1 -c "CREATE DATABASE daimon_test;"
      - name: alembic upgrade (test DB)
        env:
          DAIMON_DATABASE_URL: ${{ env.DAIMON_DATABASE__TEST_URL }}
        run: uv run alembic upgrade head
      - name: pytest (slack)
        run: uv run pytest packages/adapters/slack -n auto

  pytest-teams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: daimon
          POSTGRES_PASSWORD: daimon
          POSTGRES_DB: daimon
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U daimon"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DAIMON_DATABASE__URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon
      DAIMON_DATABASE__TEST_URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras --all-packages
      - name: Create daimon_test database
        env:
          PGPASSWORD: daimon
        run: psql -h localhost -U daimon -d daimon -v ON_ERROR_STOP=1 -c "CREATE DATABASE daimon_test;"
      - name: alembic upgrade (test DB)
        env:
          DAIMON_DATABASE_URL: ${{ env.DAIMON_DATABASE__TEST_URL }}
        run: uv run alembic upgrade head
      - name: pytest (teams)
        run: uv run pytest packages/adapters/teams -n auto

  pytest-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: daimon
          POSTGRES_PASSWORD: daimon
          POSTGRES_DB: daimon
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U daimon"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DAIMON_DATABASE__URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon
      DAIMON_DATABASE__TEST_URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras --all-packages
      - name: Create daimon_test database
        env:
          PGPASSWORD: daimon
        run: psql -h localhost -U daimon -d daimon -v ON_ERROR_STOP=1 -c "CREATE DATABASE daimon_test;"
      - name: alembic upgrade (test DB)
        env:
          DAIMON_DATABASE_URL: ${{ env.DAIMON_DATABASE__TEST_URL }}
        run: uv run alembic upgrade head
      - name: pytest (parity)
        run: uv run pytest tests/parity -n auto

  pytest-notebook-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras --all-packages
      - name: pytest (notebook-host)
        run: uv run pytest apps/notebook-host -n auto
      # The real-browser isolation test: two real marimo notebooks on their own
      # *.localhost origins in headless Chromium. Playwright stays out of the
      # locked dependencies; it is only needed here.
      - name: playwright chromium
        run: uv run --with playwright==1.63.0 playwright install --with-deps chromium
      - name: pytest (notebook-host, real browser)
        run: >-
          uv run --with playwright==1.63.0 pytest
          apps/notebook-host/tests/test_notebook_origin_browser.py -m slow

  pytest-report-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras --all-packages
      - name: pytest (report-host)
        run: uv run pytest apps/report-host -n auto

  pytest-mux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras --all-packages
      - name: pytest (mux)
        run: uv run pytest packages/mux -n auto

  # Pull requests and self-hosted main runs without GCP config exercise all
  # three Dockerfiles without publishing images or staging credentials. Hosted
  # main runs build the same Dockerfiles in docker-publish-candidate instead.
  docker-build:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main' || vars.GCP_WIF_PROVIDER == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=docker.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: daimon
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          cache-from: type=gha,scope=daimon
      - name: notebook-host
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/notebook-host/Dockerfile
          cache-from: type=gha,scope=notebook-host
      - name: report-host
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/report-host/Dockerfile
          cache-from: type=gha,scope=report-host

  # Unique candidate tags are deliberately not the 7-char SHA tags consumed
  # by promote.yml. Passing digests pins staging to these exact tested images;
  # deploy.yml assigns promotable SHA tags only after all staging gates pass.
  docker-publish-candidate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      daimon-digest: ${{ steps.daimon.outputs.digest }}
      notebook-digest: ${{ steps.notebook.outputs.digest }}
      report-digest: ${{ steps.report.outputs.digest }}
    env:
      AR_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
      REPO: ${{ vars.GCP_AR_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$AR_HOST" --quiet
      - name: Compute candidate tags
        id: tags
        run: |
          BASE="$AR_HOST/${{ vars.GCP_PROJECT_ID }}/$REPO"
          TAG="ci-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "daimon=$BASE/daimon:$TAG" >> "$GITHUB_OUTPUT"
          echo "notebook=$BASE/notebook-host:$TAG" >> "$GITHUB_OUTPUT"
          echo "report=$BASE/report-host:$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=docker.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build + push candidate daimon
        id: daimon
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.tags.outputs.daimon }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=daimon
          cache-to: type=gha,mode=max,scope=daimon,ignore-error=true
      - name: Build + push candidate notebook-host
        id: notebook
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/notebook-host/Dockerfile
          tags: ${{ steps.tags.outputs.notebook }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=notebook-host
          cache-to: type=gha,mode=max,scope=notebook-host,ignore-error=true
      - name: Build + push candidate report-host
        id: report
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/report-host/Dockerfile
          tags: ${{ steps.tags.outputs.report }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=report-host
          cache-to: type=gha,mode=max,scope=report-host,ignore-error=true

  deploy-gcp:
    name: Deploy to GCP (staging)
    needs: [lint, pytest-core, pytest-mcp, pytest-discord, pytest-slack, pytest-teams, pytest-parity, pytest-notebook-host, pytest-report-host, pytest-mux, docker-publish-candidate]
    # vars.GCP_WIF_PROVIDER doubles as the deploy switch: repository variables
    # don't propagate to forks/clones, so a repo with no GCP config skips this
    # job cleanly (green CI) instead of failing at the auth step. Operators
    # enable push-to-main deploys by setting GCP_WIF_PROVIDER, GCP_DEPLOY_SA,
    # and GCP_PROJECT_ID in repo settings — no workflow edit needed. Partial
    # config (provider set, SA/project missing) fails loudly by design.
    #
    # A push to main deploys STAGING. Production deploys only through
    # promote.yml (workflow_dispatch behind the production reviewer gate).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_WIF_PROVIDER != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      sha: ${{ github.sha }}
      daimon_digest: ${{ needs.docker-publish-candidate.outputs.daimon-digest }}
      notebook_digest: ${{ needs.docker-publish-candidate.outputs.notebook-digest }}
      report_digest: ${{ needs.docker-publish-candidate.outputs.report-digest }}
