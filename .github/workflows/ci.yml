name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's superseded run. Pushes to main
# and manual runs get a group of their own (the run id), so they are never
# cancelled and never queue behind each other: main's run is the one that
# publishes the staging candidate and deploys it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared by the jobs that need Postgres. `services:` cannot be declared in a
# composite action, so each of those jobs spells the block out; everything
# else they have in common (uv, the locked sync, daimon_test, alembic) is
# .github/actions/setup-daimon. The suites are split across parallel jobs
# rather than run as one: together they take longer than a reviewer should
# wait, and a split run names the failing area in the job list.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Silences pyright-python's "newer version available" nag in the log.
      PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-daimon

      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: pyright
        run: uv run pyright

      - name: import-linter
        run: uv run lint-imports

      - name: lint distribution boundaries
        run: uv run python scripts/lint_distribution_boundaries.py

      - name: verify built wheel boundaries
        run: |
          uv build --all-packages --wheel --out-dir "$RUNNER_TEMP/wheel-boundaries"
          uv run python scripts/lint_distribution_boundaries.py --wheels "$RUNNER_TEMP/wheel-boundaries"

      - name: lint discord modals
        run: uv run python scripts/lint_discord_modals.py

      - name: lint test anti-patterns
        run: bash scripts/lint_anti_patterns.sh

      - name: lint migrations
        run: uv run python scripts/lint_migrations.py

      - name: lint private material leakage
        run: bash scripts/lint_designators.sh

      - name: env example check
        run: uv run python scripts/generate_env_example.py --check

      - name: config reference check
        run: uv run python scripts/generate_config_reference.py --check

      - name: mcp tool catalogue check
        run: uv run python scripts/generate_mcp_tool_catalogue.py --check

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/daimon-web
          key: tailwindcss-v4.3.3-linux-x64-dc61b3ac6b8c9ca8

      - name: web CSS check
        run: uv run python scripts/generate_web_css.py --check

  # Every Postgres-backed suite but Discord, which has its own hang
  # diagnostics. `shards` > 1 splits the suite across legs by test file through
  # daimon.testing.ci_shard, balanced by the per-file seconds in ci_durations.json
  # (scripts/generate_ci_durations.py refreshes it); add legs and raise
  # `shards` together to rebalance.
  # The shard-check job proves the legs of a suite cover it exactly once.
  pytest-db:
    name: pytest-${{ matrix.suite }}${{ matrix.shards > 1 && format(' ({0}/{1})', matrix.shard, matrix.shards) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: core, shard: 0, shards: 6, fetch-depth: 0, paths: "qa/live/tests packages/core packages/adapters/cli packages/adapters/scheduler packages/testing tests/integration tests/platform_contract tests/test_*.py tests/performance" }
          - { suite: core, shard: 1, shards: 6, fetch-depth: 0, paths: "qa/live/tests packages/core packages/adapters/cli packages/adapters/scheduler packages/testing tests/integration tests/platform_contract tests/test_*.py tests/performance" }
          - { suite: core, shard: 2, shards: 6, fetch-depth: 0, paths: "qa/live/tests packages/core packages/adapters/cli packages/adapters/scheduler packages/testing tests/integration tests/platform_contract tests/test_*.py tests/performance" }
          - { suite: core, shard: 3, shards: 6, fetch-depth: 0, paths: "qa/live/tests packages/core packages/adapters/cli packages/adapters/scheduler packages/testing tests/integration tests/platform_contract tests/test_*.py tests/performance" }
          - { suite: core, shard: 4, shards: 6, fetch-depth: 0, paths: "qa/live/tests packages/core packages/adapters/cli packages/adapters/scheduler packages/testing tests/integration tests/platform_contract tests/test_*.py tests/performance" }
          - { suite: core, shard: 5, shards: 6, fetch-depth: 0, paths: "qa/live/tests packages/core packages/adapters/cli packages/adapters/scheduler packages/testing tests/integration tests/platform_contract tests/test_*.py tests/performance" }
          - { suite: mcp, shard: 0, shards: 2, fetch-depth: 1, paths: packages/adapters/mcp }
          - { suite: mcp, shard: 1, shards: 2, fetch-depth: 1, paths: packages/adapters/mcp }
          - { suite: slack, shard: 0, shards: 1, fetch-depth: 1, paths: packages/adapters/slack }
          - { suite: teams, shard: 0, shards: 1, fetch-depth: 1, paths: packages/adapters/teams }
          - { suite: parity, shard: 0, shards: 1, fetch-depth: 1, paths: tests/parity }
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: daimon
          POSTGRES_PASSWORD: daimon
          POSTGRES_DB: daimon
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U daimon"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DAIMON_DATABASE__URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon
      DAIMON_DATABASE__TEST_URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon_test
      # Temp files (tmp_path, tempfile) on tmpfs: fsync-heavy tests such as the
      # overrun latch spend most of their time waiting on the runner's disk.
      TMPDIR: /dev/shm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ matrix.fetch-depth }}  # Some core tests read other commits (origin/integration/neutral-core, pinned base commits), so core fetches full history.
      - uses: ./.github/actions/setup-daimon
        with:
          database: "true"
      - name: pytest (${{ matrix.suite }})
        run: >-
          uv run pytest ${{ matrix.paths }} -n 4 --dist worksteal
          -p daimon.testing.ci_shard --ci-shard-by=file
          --ci-shard-suite=${{ matrix.suite }}
          --ci-shard-index=${{ matrix.shard }}
          --ci-shard-count=${{ matrix.shards }} --durations=20
          --junitxml=${{ matrix.suite }}-shard-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ matrix.suite }}-shard-${{ matrix.shard }}-junit
          path: ${{ matrix.suite }}-shard-${{ matrix.shard }}.xml
          if-no-files-found: ignore

  # Sharded like pytest-db (same plugin, same duration table, checked by
  # shard-check), but with two xdist workers per leg and the hang diagnostics
  # on every leg.
  pytest-discord:
    name: pytest-${{ matrix.suite }} (${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: discord, shard: 0, shards: 2, paths: packages/adapters/discord }
          - { suite: discord, shard: 1, shards: 2, paths: packages/adapters/discord }
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: daimon
          POSTGRES_PASSWORD: daimon
          POSTGRES_DB: daimon
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U daimon"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DAIMON_DATABASE__URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon
      DAIMON_DATABASE__TEST_URL: postgresql+asyncpg://daimon:daimon@localhost:5432/daimon_test
      # Temp files (tmp_path, tempfile) on tmpfs: fsync-heavy tests such as the
      # overrun latch spend most of their time waiting on the runner's disk.
      TMPDIR: /dev/shm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-daimon
        with:
          database: "true"
      - name: pytest (${{ matrix.suite }})
        id: discord-pytest
        timeout-minutes: 13
        env:
          DAIMON_PYTEST_HANG_DIR: ${{ runner.temp }}
          PGPASSWORD: daimon
        run: |
          (sleep 360; bash .github/scripts/discord-postgres-diagnostics.sh > "$RUNNER_TEMP/discord-postgres-hang.txt" 2>&1) &
          diagnostic_pid=$!
          trap 'kill "$diagnostic_pid" 2>/dev/null || true' EXIT
          uv run pytest ${{ matrix.paths }} -n 2 -rfE --tb=short -o faulthandler_timeout=300 -p daimon.testing.ci_shard --ci-shard-by=file --ci-shard-suite=${{ matrix.suite }} --ci-shard-index=${{ matrix.shard }} --ci-shard-count=${{ matrix.shards }} --durations=20 --junitxml=${{ matrix.suite }}-shard-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ matrix.suite }}-shard-${{ matrix.shard }}-junit
          path: ${{ matrix.suite }}-shard-${{ matrix.shard }}.xml
          if-no-files-found: ignore
      - name: Discord hang diagnostics
        if: always() && steps.discord-pytest.outcome != 'success'
        env:
          PGPASSWORD: daimon
        run: |
          for file in "$RUNNER_TEMP"/discord-pytest-failure-*.txt; do
            if [ -f "$file" ]; then
              echo "Failure report in ${file##*/}:"
              cat "$file"
            fi
          done
          for file in "$RUNNER_TEMP"/discord-pytest-current-*.txt; do
            if [ -f "$file" ]; then
              echo "Active test in ${file##*/}:"
              cat "$file"
            fi
          done
          if [ -f "$RUNNER_TEMP/discord-postgres-hang.txt" ]; then
            echo "Postgres snapshot while pytest was still running:"
            cat "$RUNNER_TEMP/discord-postgres-hang.txt"
          fi
          echo "Postgres snapshot after pytest stopped:"
          bash .github/scripts/discord-postgres-diagnostics.sh

  # Suites that need no database.
  pytest-light:
    name: pytest-${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: report-host, paths: apps/report-host }
          - { suite: harness, paths: apps/harness }
          - { suite: mux, paths: packages/mux }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-daimon
      - name: pytest (${{ matrix.suite }})
        run: >-
          uv run pytest ${{ matrix.paths }} -n 4 --dist worksteal
          --durations=20 --junitxml=${{ matrix.suite }}.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ matrix.suite }}-junit
          path: ${{ matrix.suite }}.xml
          if-no-files-found: ignore

  pytest-notebook-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-daimon
      - name: pytest (notebook-host)
        run: >-
          uv run pytest apps/notebook-host -n 4 --dist worksteal
          --durations=20 --junitxml=notebook-host.xml
      # The real-browser isolation test: two real marimo notebooks on their own
      # *.localhost origins in headless Chromium. Playwright stays out of the
      # locked dependencies; it is only needed here.
      - name: playwright chromium
        run: uv run --with playwright==1.63.0 playwright install --with-deps chromium
      - name: pytest (notebook-host, real browser)
        run: >-
          uv run --with playwright==1.63.0 pytest
          apps/notebook-host/tests/test_notebook_origin_browser.py -m slow
          --durations=20 --junitxml=notebook-host-browser.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: notebook-host-junit
          path: notebook-host*.xml
          if-no-files-found: ignore

  # Collect-only, so it needs no database: every sharded suite's legs together
  # must collect exactly what the suite collects unsharded, each test file in
  # exactly one leg. Reads the matrices of every job that loads the shard
  # plugin (pytest-db, pytest-discord), so a new leg is checked as added.
  shard-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-daimon
      - name: shards cover each suite exactly once
        run: uv run python scripts/check_ci_shards.py

  # Pull requests and self-hosted main runs without GCP config exercise all
  # three Dockerfiles without publishing images or staging credentials. Hosted
  # main runs build the same Dockerfiles in docker-publish-candidate instead.
  docker-build:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main' || vars.GCP_WIF_PROVIDER == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=docker.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: daimon
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          cache-from: type=gha,scope=daimon
      - name: notebook-host
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/notebook-host/Dockerfile
          cache-from: type=gha,scope=notebook-host
      - name: report-host
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/report-host/Dockerfile
          cache-from: type=gha,scope=report-host

  harness-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=docker.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: harness
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/harness/Dockerfile
          cache-from: type=gha,scope=harness
          cache-to: type=gha,mode=max,scope=harness
          load: true
          tags: daimon-harness:test
      - name: data stack and service imports
        run: docker run --rm daimon-harness:test python -c 'import numpy, pandas, pymc, pymc_marketing, daimon_harness.service'
      - name: isolated tool identities
        run: docker run --rm -i daimon-harness:test python - < apps/harness/tests/image_probe.py
      - name: managed identity startup without an API key
        run: docker run --rm -i daimon-harness:test python - < apps/harness/tests/identity_probe.py
      - name: arbitrary credential mount isolation
        run: |
          probe_dir=$(mktemp -d)
          printf '%s\n' 'synthetic-api-key' > "$probe_dir/model.env"
          chmod 644 "$probe_dir/model.env"
          docker run --rm -i -v "$probe_dir/model.env:/mnt/model.env:ro" \
            daimon-harness:test python - < apps/harness/tests/mount_probe.py
      - name: multi-session proc and temporary-file isolation
        # Mount configuration needs SYS_ADMIN only during this test's root setup;
        # the harness drops it before any tool process runs.
        run: |
          docker run --rm -i --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            -e HARNESS_SESSION_MODE=multi \
            daimon-harness:test bash -c \
            'mount -o remount,hidepid=2 /proc && chmod 755 /tmp /var/tmp /dev/shm /run/lock && exec python -' < apps/harness/tests/image_probe.py

  # Unique candidate tags are deliberately not the 7-char SHA tags consumed
  # by promote.yml. Passing digests pins staging to these exact tested images;
  # deploy.yml assigns promotable SHA tags only after all staging gates pass.
  docker-publish-candidate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      daimon-digest: ${{ steps.daimon.outputs.digest }}
      notebook-digest: ${{ steps.notebook.outputs.digest }}
      report-digest: ${{ steps.report.outputs.digest }}
    env:
      AR_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
      REPO: ${{ vars.GCP_AR_REPO }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          skip_install: true
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$AR_HOST" --quiet
      - name: Compute candidate tags
        id: tags
        run: |
          BASE="$AR_HOST/${{ vars.GCP_PROJECT_ID }}/$REPO"
          TAG="ci-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "daimon=$BASE/daimon:$TAG" >> "$GITHUB_OUTPUT"
          echo "notebook=$BASE/notebook-host:$TAG" >> "$GITHUB_OUTPUT"
          echo "report=$BASE/report-host:$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=docker.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build + push candidate daimon
        id: daimon
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.tags.outputs.daimon }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=daimon
          cache-to: type=gha,mode=max,scope=daimon,ignore-error=true
      - name: Build + push candidate notebook-host
        id: notebook
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/notebook-host/Dockerfile
          tags: ${{ steps.tags.outputs.notebook }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=notebook-host
          cache-to: type=gha,mode=max,scope=notebook-host,ignore-error=true
      - name: Build + push candidate report-host
        id: report
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/report-host/Dockerfile
          tags: ${{ steps.tags.outputs.report }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=report-host
          cache-to: type=gha,mode=max,scope=report-host,ignore-error=true

  deploy-gcp:
    name: Deploy to GCP (staging)
    needs: [lint, shard-check, pytest-db, pytest-discord, pytest-light, pytest-notebook-host, docker-publish-candidate]
    # vars.GCP_WIF_PROVIDER doubles as the deploy switch: repository variables
    # don't propagate to forks/clones, so a repo with no GCP config skips this
    # job cleanly (green CI) instead of failing at the auth step. Operators
    # enable push-to-main deploys by setting GCP_WIF_PROVIDER, GCP_DEPLOY_SA,
    # and GCP_PROJECT_ID in repo settings — no workflow edit needed. Partial
    # config (provider set, SA/project missing) fails loudly by design.
    #
    # A push to main deploys STAGING. Production deploys only through
    # promote.yml (workflow_dispatch behind the production reviewer gate).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_WIF_PROVIDER != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      sha: ${{ github.sha }}
      daimon_digest: ${{ needs.docker-publish-candidate.outputs.daimon-digest }}
      notebook_digest: ${{ needs.docker-publish-candidate.outputs.notebook-digest }}
      report_digest: ${{ needs.docker-publish-candidate.outputs.report-digest }}
