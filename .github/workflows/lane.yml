name: Dev lane

on:
  push:
    branches:
      - 'lane/**'
  workflow_dispatch:
    inputs:
      action:
        description: Lane action
        required: true
        default: deploy
        type: choice
        options: [deploy, reset, status, down]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.validate.outputs.lane }}
      action: ${{ steps.validate.outputs.action }}
    steps:
      - name: Validate lane ref and action
        id: validate
        env:
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" == lane/* ]] || { echo 'Select a lane/<name> branch' >&2; exit 1; }
          lane="${REF_NAME#lane/}"
          [[ "$lane" =~ ^[a-z][a-z0-9-]{1,19}$ ]] || { echo 'Invalid lane name' >&2; exit 1; }
          action="${REQUESTED_ACTION:-deploy}"
          case "$action" in deploy|reset|status|down) ;; *) echo 'Invalid action' >&2; exit 1 ;; esac
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

  lane:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: lane-${{ needs.prepare.outputs.lane }}
    concurrency:
      group: lane-${{ needs.prepare.outputs.lane }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      deployments: write
    env:
      LANE: ${{ needs.prepare.outputs.lane }}
      ACTION: ${{ needs.prepare.outputs.action }}
      SHA: ${{ github.sha }}
      PROJECT: ${{ vars.LANES_PROJECT }}
      REGION: ${{ vars.LANES_REGION }}
      ZONE: ${{ vars.LANES_ZONE }}
      HOST: ${{ vars.LANES_HOST }}
      # gcloud ssh below takes neither --project nor --quiet: the workflow SSH
      # guard (tests/test_deploy_workflow_quotes.py) fixes its argument shape.
      CLOUDSDK_CORE_PROJECT: ${{ vars.LANES_PROJECT }}
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      ACTOR: ${{ github.actor }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        if: needs.prepare.outputs.action == 'deploy'
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ vars.LANES_WIF_PROVIDER }}
          service_account: ${{ vars.LANES_DEPLOY_SA }}
          project_id: ${{ vars.LANES_PROJECT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/setup-buildx-action@v3
        if: needs.prepare.outputs.action == 'deploy'
        with:
          driver-opts: image=docker.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Set image reference
        id: image
        if: needs.prepare.outputs.action == 'deploy'
        run: |
          set -euo pipefail
          image="$REGION-docker.pkg.dev/$PROJECT/lanes/daimon:$LANE-$SHA"
          echo "DAIMON_LANE_IMAGE=$image" >> "$GITHUB_ENV"
          echo "ref=$image" >> "$GITHUB_OUTPUT"
          notebook="$REGION-docker.pkg.dev/$PROJECT/lanes/notebook-host:$LANE-$SHA"
          echo "DAIMON_NOTEBOOK_IMAGE=$notebook" >> "$GITHUB_ENV"
          echo "notebook=$notebook" >> "$GITHUB_OUTPUT"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build and push lane image
        if: needs.prepare.outputs.action == 'deploy'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=daimon-lane
          cache-to: type=gha,mode=max,scope=daimon-lane,ignore-error=true
      - name: Build and push notebook host
        if: needs.prepare.outputs.action == 'deploy'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/notebook-host/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.notebook }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=notebook-host-lane
          cache-to: type=gha,mode=max,scope=notebook-host-lane,ignore-error=true
      - name: Run lane action
        run: |
          set -euo pipefail
          remote="/tmp/daimon-lane-${LANE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yml"
          # Install the host CLI version that infra last applied to VM metadata.
          refresh='curl -fsS -H Metadata-Flavor:Google http://metadata.google.internal/computeMetadata/v1/instance/attributes/lane-script -o /tmp/lane.new && sudo install -m 0755 /tmp/lane.new /usr/local/bin/lane'
          # Redirects stay at the call sites so the SSH line keeps the guarded shape.
          lane_ssh() {
            gcloud compute ssh ${{ vars.LANES_HOST }} --zone "$ZONE" \
              --tunnel-through-iap --command="$1"
          }
          lane_ssh "$refresh" >/dev/null 2>&1
          if [[ "$ACTION" == deploy ]]; then
            # The host CLI owns .env and records this compose for reset/redeploy.
            # Render only the image variable; never interpolate lane secrets here.
            sed "s|\${DAIMON_NOTEBOOK_IMAGE:-notebook-host:unconfigured}|$DAIMON_NOTEBOOK_IMAGE|g" \
              deploy/lanes/compose.lane.yml > "$RUNNER_TEMP/compose.lane.yml"
            gcloud compute scp "$RUNNER_TEMP/compose.lane.yml" "$HOST:$remote" \
              --project="$PROJECT" --zone="$ZONE" --tunnel-through-iap --quiet
            printf -v command '%q ' sudo lane deploy "$LANE" --image "$DAIMON_LANE_IMAGE" \
              --sha "$SHA" --compose "$remote" --actor "$ACTOR" --run-url "$RUN_URL"
          else
            printf -v command '%q ' sudo lane "$ACTION" "$LANE"
          fi
          # The host owns full deployment logs. This public workflow prints no
          # remote output, including failure output from older host CLI versions.
          if ! lane_ssh "$command" >/dev/null 2>"$RUNNER_TEMP/lane.err"; then
            # Only the host CLI's fixed-format messages are safe to show here.
            grep -E '^(missing enabled secret version: lane-[a-z0-9-]+|secret access failed: lane-[a-z0-9-]+|unknown lane: [a-z0-9-]+|lane [a-z0-9-]+ is busy|no recorded deployment|invalid sha|image does not match lane and SHA|service=[a-z0-9_-]+ state=[a-z]+ exit=[0-9-]+ restarts=[0-9]+)$' \
              "$RUNNER_TEMP/lane.err" >&2 || true
            echo 'Lane action failed. Full logs stay on the lane host (sudo lane logs).' >&2
            exit 1
          fi
      - name: Summarize lane status
        if: always() && steps.auth.outcome == 'success'
        run: |
          set -euo pipefail
          printf -v command '%q ' sudo lane status "$LANE" --json
          lane_ssh() {
            gcloud compute ssh ${{ vars.LANES_HOST }} --zone "$ZONE" \
              --tunnel-through-iap --command="$1"
          }
          raw=$(lane_ssh "$command" 2>/dev/null) || raw='{}'
          # State JSON also carries run_url and other metadata; allow only the
          # fields approved for public Actions summaries.
          safe=$(jq -ce '{sha: (.sha // ""), image: (.image // ""),
            status: (.status // "unavailable"),
            services: ((.containers // []) | map({name, revision, running, health, restarts}))}' \
            <<< "$raw") || safe='{"sha":"","image":"","status":"unavailable","services":[]}'
          recorded_sha=$(jq -r '.sha' <<< "$safe")
          recorded_image=$(jq -r '.image' <<< "$safe")
          statuses=$(jq -c '{status, services}' <<< "$safe")
          {
            echo "### Lane $LANE"
            echo "- SHA: \`${recorded_sha:-$SHA}\`"
            echo "- Image: \`${recorded_image:-${DAIMON_LANE_IMAGE:-none}}\`"
            echo "- Actor: \`$ACTOR\`"
            echo '```json'
            echo "$statuses"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
