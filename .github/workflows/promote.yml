name: Promote
run-name: Promote ${{ inputs.sha }}

# Production promote/rollback path. The ONLY way code reaches production:
# an operator dispatches this workflow with a full commit SHA that has
# already soaked on staging. Rollback is the same operation pointed at an
# older SHA, and works only when no migration landed in between. The
# `production` GitHub Environment enforces the required reviewers before any
# deploy authority is granted. The run name carries the SHA, so tools without
# a checkout can read what production runs from the run list.
#
# Promotion is ARTIFACT-level: the validate job resolves the digests staging
# tagged with the full SHA, a tag only main CI's staging deploy writes, and only
# after every gate passed (deploy.yml, "Mark tested staging images promotable").
# The production deploy copies exactly those images into its own registry.
# `rebuild` builds from source at the SHA instead, as promotes did before; docker
# builds are not reproducible, so that path ships bytes that never soaked.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-char commit SHA to promote to production"
        required: true
        type: string
      rebuild:
        description: "Build from source instead of promoting staging's soaked images"
        type: boolean
        default: false

jobs:
  validate:
    name: Validate promote SHA
    runs-on: ubuntu-latest
    # Uses the STAGING Environment: after the CI flip, every main push builds
    # images into staging's registry, so staging AR is where a soaked image
    # lives (prod AR is only populated by the promote deploy itself). This
    # also runs validation before the production reviewer gate — a bad SHA
    # fails fast without paging reviewers.
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      daimon_digest: ${{ steps.soaked.outputs.daimon_digest }}
      notebook_digest: ${{ steps.soaked.outputs.notebook_digest }}
      report_digest: ${{ steps.soaked.outputs.report_digest }}
      registry: ${{ steps.soaked.outputs.registry }}
    env:
      AR_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # inputs.sha is free-text; always pass it through `env` so the shell
      # sees it as data — inline `${{ }}` interpolation in `run:` would let a
      # crafted input execute in a job holding id-token: write.
      - name: Assert full 40-hex SHA
        env:
          SHA: ${{ inputs.sha }}
        run: |
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "Input '$SHA' is not a full 40-char lowercase hex SHA" >&2; exit 1; }

      - name: Assert SHA is an ancestor of main
        env:
          SHA: ${{ inputs.sha }}
        run: |
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "SHA $SHA is not an ancestor of origin/main — refusing to promote" >&2; exit 1; }

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # The runner image ships gcloud; installing another copy cost ~20s.
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          skip_install: true

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        if: inputs.rebuild != true
        with:
          version: v0.22.1

      # A missing full-SHA tag means staging never passed its gates at this SHA: fail
      # closed, before the production reviewers are paged. The daimon image must also
      # carry a release main reached by this SHA (an unchanged image is reused from an
      # earlier one), so a tag pushed by hand onto another build is refused.
      - name: Resolve the soaked images for this SHA
        id: soaked
        if: inputs.rebuild != true
        env:
          SHA: ${{ inputs.sha }}
          REGISTRY: ${{ env.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}
        run: |
          gcloud auth configure-docker "$AR_HOST" --quiet
          for image in daimon:daimon notebook:notebook-host report:report-host; do
            name="${image%%:*}" package="${image#*:}"
            digest=$(gcloud artifacts docker images describe "$REGISTRY/$package:$SHA" \
              --format='value(image_summary.digest)') || digest=""
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "No soaked image at $REGISTRY/$package:$SHA: promote a SHA main CI deployed to staging" >&2
              exit 1
            }
            echo "${name}_digest=$digest" >> "$GITHUB_OUTPUT"
            [ "$name" != daimon ] || daimon="$digest"
          done
          release=$(crane config "$REGISTRY/daimon@$daimon" \
            | jq -r '.config.Env[]? | select(startswith("DAIMON_RELEASE=")) | ltrimstr("DAIMON_RELEASE=")')
          [[ "$release" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$release" "$SHA" || {
            echo "$REGISTRY/daimon:$SHA was built from '$release', not from main at or before $SHA" >&2
            exit 1
          }
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

  deploy:
    name: Promote to production
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      sha: ${{ inputs.sha }}
      daimon_digest: ${{ needs.validate.outputs.daimon_digest }}
      notebook_digest: ${{ needs.validate.outputs.notebook_digest }}
      report_digest: ${{ needs.validate.outputs.report_digest }}
      source_registry: ${{ needs.validate.outputs.registry }}

  # A real turn per backend right after the deploy; a failed canary turns the promote red.
  # Off until the production-canary environment is set up (canary.yml).
  verify:
    name: Production canary
    needs: deploy
    if: vars.PRODUCTION_CANARY == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/canary.yml
    with:
      environments: '["production-canary"]'
