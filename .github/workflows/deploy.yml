name: Deploy

# How the maintainers deploy the hosted instance to their own Google Cloud
# project. Self-hosting needs none of this: docker compose is the supported
# path and the self-hosting guide in docs/ is the one to read. It lives here
# so the pipeline that ships the hosted instance is reviewable alongside the
# code it ships.
#
# Every project id, region, bucket and domain arrives through repository
# variables, so a fork inherits nothing. The assets the VM steps pull from a
# bucket (the env refresh script, the compose files, the Caddyfile) describe
# one particular estate and are kept in the operator's private
# infrastructure repository rather than here.
#
# Reusable deploy body: callable from other workflows (workflow_call) or
# dispatched manually (workflow_dispatch). Deliberately no push trigger —
# adding this file changes no existing deploy behavior.
on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment to deploy (staging or production)"
        required: true
        type: string
      sha:
        description: "Full commit SHA to deploy"
        required: true
        type: string
      daimon_digest:
        description: "Prebuilt staging daimon image digest from this CI run"
        required: false
        type: string
      notebook_digest:
        description: "Prebuilt staging notebook-host image digest from this CI run"
        required: false
        type: string
      report_digest:
        description: "Prebuilt staging report-host image digest from this CI run"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment to deploy"
        required: true
        # choice, not string: a free-text typo (Production, prod) would create
        # an implicit GitHub Environment with no protection rules that falls
        # back to repo-level vars and deploys with no reviewer gate at all.
        type: choice
        options:
          - staging
          - production
      sha:
        description: "Full 40-char commit SHA to deploy"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to GCP (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-gcp-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      REGION: ${{ vars.GCP_REGION }}
      AR_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
      REPO: ${{ vars.GCP_AR_REPO }}
      ZONE: ${{ vars.GCP_ZONE }}
      NOTEBOOK_DOMAIN: ${{ vars.NOTEBOOK_DOMAIN }}
      REPORT_DOMAIN: ${{ vars.REPORT_DOMAIN }}
    steps:
      # Guard both entry points: ci.yml/promote.yml pass a full github.sha,
      # but workflow_dispatch is free text — reject branch names, short SHAs,
      # and anything else that isn't a pinned 40-hex commit. Passed via env so
      # the input is data, never shell code.
      - name: Assert full 40-hex SHA
        env:
          SHA: ${{ inputs.sha }}
        run: |
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "Input '$SHA' is not a full 40-char lowercase hex SHA" >&2; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # The runner image ships gcloud; installing another copy cost ~20s.
      - uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

      - name: Compute image tags
        id: tags
        run: |
          # Deterministic 7-char truncation, NOT `git rev-parse --short`:
          # --short honors core.abbrev=auto and grows with the object count,
          # which would silently change the tag scheme and break promote.yml's
          # image-exists check (it truncates the input SHA to 7 chars).
          SHA=$(git rev-parse HEAD | cut -c1-7)
          BASE=${{ env.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ env.REPO }}
          echo "daimon=$BASE/daimon:$SHA" >> "$GITHUB_OUTPUT"
          echo "notebook=$BASE/notebook-host:$SHA" >> "$GITHUB_OUTPUT"
          echo "report=$BASE/report-host:$SHA" >> "$GITHUB_OUTPUT"

      - name: Select immutable prebuilt images or canonical build tags
        id: images
        env:
          DAIMON_DIGEST: ${{ inputs.daimon_digest }}
          NOTEBOOK_DIGEST: ${{ inputs.notebook_digest }}
          REPORT_DIGEST: ${{ inputs.report_digest }}
        run: |
          if [ -z "$DAIMON_DIGEST$NOTEBOOK_DIGEST$REPORT_DIGEST" ]; then
            echo "prebuilt=false" >> "$GITHUB_OUTPUT"
            echo "daimon=${{ steps.tags.outputs.daimon }}" >> "$GITHUB_OUTPUT"
            echo "notebook=${{ steps.tags.outputs.notebook }}" >> "$GITHUB_OUTPUT"
            echo "report=${{ steps.tags.outputs.report }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A partial or malformed set must never silently fall back to a build.
          for digest in "$DAIMON_DIGEST" "$NOTEBOOK_DIGEST" "$REPORT_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          done
          if [ "${{ inputs.environment }}" != staging ]; then
            echo "Prebuilt digests are restricted to staging" >&2
            exit 1
          fi
          BASE="$AR_HOST/${{ vars.GCP_PROJECT_ID }}/$REPO"
          echo "prebuilt=true" >> "$GITHUB_OUTPUT"
          echo "daimon=$BASE/daimon@$DAIMON_DIGEST" >> "$GITHUB_OUTPUT"
          echo "notebook=$BASE/notebook-host@$NOTEBOOK_DIGEST" >> "$GITHUB_OUTPUT"
          echo "report=$BASE/report-host@$REPORT_DIGEST" >> "$GITHUB_OUTPUT"
          # Confirm Buildx's digest is a manifest Artifact Registry can serve.
          for image in "$BASE/daimon@$DAIMON_DIGEST" "$BASE/notebook-host@$NOTEBOOK_DIGEST" "$BASE/report-host@$REPORT_DIGEST"; do
            gcloud artifacts docker images describe "$image" --format=json >/dev/null
          done

      # Manual staging and production deploys still build from the pinned SHA.
      # Main CI passes prebuilt digests and skips these steps. No provenance or
      # SBOM attestations: they would turn the push into an image index, while
      # existing consumers expect a plain image manifest.
      - uses: docker/setup-buildx-action@v3
        if: steps.images.outputs.prebuilt != 'true'
        with:
          driver-opts: image=docker.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Build + push daimon image
        if: steps.images.outputs.prebuilt != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.tags.outputs.daimon }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=daimon

      - name: Build + push notebook-host image
        if: steps.images.outputs.prebuilt != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/notebook-host/Dockerfile
          tags: ${{ steps.tags.outputs.notebook }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=notebook-host

      - name: Build + push report-host image
        if: steps.images.outputs.prebuilt != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/report-host/Dockerfile
          tags: ${{ steps.tags.outputs.report }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=report-host

      - name: Run migrations (blocking gate)
        run: |
          gcloud run jobs update ${{ vars.GCP_AR_REPO }}-migrate --region "$REGION" \
            --image "${{ steps.images.outputs.daimon }}"
          gcloud run jobs execute ${{ vars.GCP_AR_REPO }}-migrate --region "$REGION" --wait

      - name: Deploy mcp revision
        run: |
          gcloud run services update ${{ vars.GCP_AR_REPO }}-mcp --region "$REGION" \
            --image "${{ steps.images.outputs.daimon }}"

      - name: Resolve seam URL for report-host
        id: seam
        run: |
          # report-host's DAIMON_REPORT__MCP_URL points at the same mcp
          # Cloud Run service the workers call, mounted at /mcp. The service
          # URL is stable for the life of the service but has no predictable
          # form, so it is discovered the same way the health gate step
          # below discovers it, not hardcoded or stored as a variable.
          URL=$(gcloud run services describe ${{ vars.GCP_AR_REPO }}-mcp --region "$REGION" \
            --format='value(status.url)')
          echo "url=$URL/mcp" >> "$GITHUB_OUTPUT"

      - name: Register the IAP SSH key
        run: |
          # The first `gcloud compute ssh` on a fresh runner generates a key
          # and writes it to project metadata. Doing that once here keeps the
          # two VM refreshes below, which run side by side, from racing on it.
          gcloud compute ssh ${{ vars.GCP_AR_REPO }}-notebook --zone "$ZONE" \
            --tunnel-through-iap --command true
          # gcloud waits for a new key to reach only the VM it connects to, so
          # wait for the workers VM (when running) to accept it as well.
          STATUS=$(gcloud compute instances describe ${{ vars.GCP_AR_REPO }}-workers \
            --zone "$ZONE" --format='value(status)')
          if [ "$STATUS" = "RUNNING" ]; then
            for i in $(seq 1 6); do
              if gcloud compute ssh ${{ vars.GCP_AR_REPO }}-workers --zone "$ZONE" \
                --tunnel-through-iap --command true; then
                break
              fi
              if [ "$i" = "6" ]; then
                echo "workers VM did not accept the SSH key" >&2
                exit 1
              fi
              sleep 10
            done
          fi

      - name: Start notebook-host VM refresh (in the background)
        id: notebook_refresh
        run: |
          # Runs alongside the worker refresh below; the two VMs share nothing.
          # Output and exit status go to files rather than this step's log, so
          # the step returns at once and "Wait for notebook-host VM refresh"
          # reports both once the worker refresh is done.
          (
            rc=0
            gcloud compute ssh ${{ vars.GCP_AR_REPO }}-notebook --zone "$ZONE" \
              --tunnel-through-iap --command '
                # Same reason as the workers refresh below: without this the
                # exit status comes from the trailing `prune || true` and every
                # failure inside is silent.
                set -euo pipefail
                export NOTEBOOK_IMAGE="${{ steps.images.outputs.notebook }}"
                # Caddy fronts notebook-host with TLS on this domain; the compose
                # file interpolates NOTEBOOK_DOMAIN + NOTEBOOK_PUBLIC_URL_BASE
                export NOTEBOOK_DOMAIN="${{ env.NOTEBOOK_DOMAIN }}"
                export NOTEBOOK_PUBLIC_URL_BASE="https://${{ env.NOTEBOOK_DOMAIN }}"
                # report-host is the second service on this same VM, behind the
                # same Caddy on its own hostname.
                export REPORT_IMAGE="${{ steps.images.outputs.report }}"
                export REPORT_DOMAIN="${{ env.REPORT_DOMAIN }}"
                export REPORT_PUBLIC_URL_BASE="https://${{ env.REPORT_DOMAIN }}"
                export REPORT_MCP_URL="${{ steps.seam.outputs.url }}"
                # Same DOCKER_CONFIG redirect as the workers refresh: use root
                # docker config (has the Artifact Registry credential helper).
                export DOCKER_CONFIG=/root/.docker
                # Ordering matters: refresh env -> refresh compose assets ->
                # pull -> up -d. Recreating (up -d) is what makes a container
                # read the new env_file; docker restart does NOT. NOTEBOOK_IMAGE
                # must keep coming from the freshly computed tag exported above
                # and must never be re-derived from VM metadata (stale metadata
                # rolls the image back). The refresh script (pulled from the
                # assets bucket) exits nonzero on a
                # permission or transient Secret Manager failure, failing the
                # deploy — intended: a config the pipeline cannot assemble must
                # not read green.
                sudo gcloud storage cp gs://${{ vars.GCP_AR_REPO }}-assets/daimon-refresh-env /usr/local/bin/daimon-refresh-env
                sudo chmod 755 /usr/local/bin/daimon-refresh-env
                sudo /usr/local/bin/daimon-refresh-env
                sudo gcloud storage cp gs://${{ vars.GCP_AR_REPO }}-assets/compose.notebook.yml /etc/daimon/compose.notebook.yml
                caddyfile_before=$(sudo sha256sum /etc/daimon/Caddyfile 2>/dev/null || true)
                sudo gcloud storage cp gs://${{ vars.GCP_AR_REPO }}-assets/Caddyfile /etc/daimon/Caddyfile
                cd /etc/daimon
                sudo -E docker compose -f compose.notebook.yml pull
                sudo -E docker compose -f compose.notebook.yml up -d --remove-orphans
                # Caddy reads its config only at start, and `up -d` does not
                # recreate it for a changed bind-mounted file: restart on change.
                if [ "$caddyfile_before" != "$(sudo sha256sum /etc/daimon/Caddyfile)" ]; then
                  sudo -E docker compose -f compose.notebook.yml restart caddy
                  sleep 5
                  # A bad Caddyfile exits at start; the report gate below skips Caddy.
                  if [ "$(sudo docker inspect --format "{{.State.Running}}" daimon-caddy-1)" != "true" ]; then
                    echo "caddy not running after its config changed" >&2
                    exit 1
                  fi
                fi
                # Gate: report-host must come up and stay up. `up -d` alone does
                # not fail on a crash-looping container, and a green step that
                # proves nothing is worse than a red one -- same reasoning as
                # the slack worker gate below, modelled on it here.
                for i in $(seq 1 20); do
                  sleep 6
                  running=$(sudo docker inspect --format "{{.State.Running}}" daimon-report-host-1)
                  restarts=$(sudo docker inspect --format "{{.RestartCount}}" daimon-report-host-1)
                  if [ "$running" = "true" ] && [ "$restarts" = "0" ] \
                    && sudo docker exec daimon-report-host-1 python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8002/health\", timeout=3)" 2>/dev/null; then
                    echo "report host healthy (attempt $i)"
                    break
                  fi
                  if [ "$i" = "20" ]; then
                    echo "report host not healthy after 120s (running=$running restarts=$restarts)" >&2
                    exit 1
                  fi
                done
                # Same prune as the workers refresh (see comment there).
                sudo docker image prune -af || true
              ' || rc=$?
            echo "$rc" > "$RUNNER_TEMP/notebook-refresh.rc.tmp"
            mv "$RUNNER_TEMP/notebook-refresh.rc.tmp" "$RUNNER_TEMP/notebook-refresh.rc"
          ) > "$RUNNER_TEMP/notebook-refresh.log" 2>&1 < /dev/null &

      - name: Refresh worker VM containers (recreate in place)
        run: |
          # Skip the refresh when the workers VM is stopped (nothing to recreate).
          STATUS=$(gcloud compute instances describe ${{ vars.GCP_AR_REPO }}-workers \
            --zone "$ZONE" --format='value(status)')
          if [ "$STATUS" != "RUNNING" ]; then
            echo "workers VM is $STATUS — skipping container refresh"
            exit 0
          fi
          gcloud compute ssh ${{ vars.GCP_AR_REPO }}-workers --zone "$ZONE" \
            --tunnel-through-iap --command '
              # Without this the payload runs to the end regardless and the
              # step exits with the status of the LAST command -- the trailing
              # `prune || true` -- so a failed asset fetch, a failed env
              # refresh, or a failed `up -d` all reported success. Every
              # "refresh failed" comment below was aspirational until now.
              set -euo pipefail
              export DAIMON_IMAGE="${{ steps.images.outputs.daimon }}"
              # sudo -E keeps the SSH user HOME, so docker would look for
              # Artifact Registry credentials in ~/.docker (none there). Point
              # at root docker config, where the boot startup script ran
              # `gcloud auth configure-docker`.
              export DOCKER_CONFIG=/root/.docker
              # Ordering matters: refresh env -> refresh compose assets ->
              # pull -> up -d. Recreating (up -d) is what makes a container
              # read the new env_file; docker restart does NOT, which cost
              # real time in the past. DAIMON_IMAGE must keep coming from the
              # freshly computed tag exported above and must never be
              # re-derived from VM metadata (stale metadata rolls the image
              # back). The refresh script (pulled from the assets bucket)
              # exits nonzero on a permission or transient
              # Secret Manager failure, failing the deploy — intended: a
              # config the pipeline cannot assemble must not read green.
              sudo gcloud storage cp gs://${{ vars.GCP_AR_REPO }}-assets/daimon-refresh-env /usr/local/bin/daimon-refresh-env
              sudo chmod 755 /usr/local/bin/daimon-refresh-env
              sudo /usr/local/bin/daimon-refresh-env
              sudo gcloud storage cp gs://${{ vars.GCP_AR_REPO }}-assets/compose.worker.yml /etc/daimon/compose.worker.yml
              cd /etc/daimon
              sudo -E docker compose -f compose.worker.yml pull
              # --timeout exceeds the 90s stop_grace_period in the worker asset.
              # The adapters drain in-flight turns for up to 60s
              # after SIGTERM (_DRAIN_GRACE_S), but docker kills a container
              # 10s after SIGTERM by default, so every recreate cut live
              # turns and left a "Daimon restarted" card behind.
              sudo -E docker compose -f compose.worker.yml up -d --remove-orphans --timeout 95
              # Gate: the slack worker must come up and stay up. Its liveness
              # responder binds only once startup is done (including
              # `daimon defaults apply` when the service runs through the image
              # entrypoint), and a bad Slack config crash-loops the container rather than
              # failing `up -d` — so require a running container with zero
              # restarts that answers on its liveness port before calling the
              # refresh done. Discord fails loudly on its own (bad token kills
              # the gateway handshake); Slack is the one that dies silently.
              for i in $(seq 1 20); do
                sleep 6
                running=$(sudo docker inspect --format "{{.State.Running}}" daimon-slack-1)
                restarts=$(sudo docker inspect --format "{{.RestartCount}}" daimon-slack-1)
                if [ "$running" = "true" ] && [ "$restarts" = "0" ] \
                  && sudo docker exec daimon-slack-1 python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8083/\", timeout=3)" 2>/dev/null; then
                  echo "slack worker healthy (attempt $i)"
                  break
                fi
                if [ "$i" = "20" ]; then
                  echo "slack worker not healthy after 120s (running=$running restarts=$restarts)" >&2
                  exit 1
                fi
              done
              # Prune superseded image tags after the new ones are in use —
              # each deploy leaves a ~1GB tag behind, and a full root disk
              # breaks IAP SSH key writes (breaking this very refresh step).
              sudo docker image prune -af || true
            '
          date +%s > "$RUNNER_TEMP/workers-refreshed-at"

      - name: Wait for notebook-host VM refresh
        # Also after a failed worker refresh, so the notebook-host outcome is
        # always on record; not after a cancel, which ends the job anyway.
        if: ${{ !cancelled() && steps.notebook_refresh.outcome == 'success' }}
        run: |
          # 15 minutes; the refresh's own gates give up well before that.
          for _ in $(seq 1 450); do
            [ -f "$RUNNER_TEMP/notebook-refresh.rc" ] && break
            sleep 2
          done
          cat "$RUNNER_TEMP/notebook-refresh.log"
          if [ ! -f "$RUNNER_TEMP/notebook-refresh.rc" ]; then
            echo "notebook-host refresh still running after 15 minutes" >&2
            exit 1
          fi
          exit "$(cat "$RUNNER_TEMP/notebook-refresh.rc")"

      - name: Health gate
        run: |
          URL=$(gcloud run services describe ${{ vars.GCP_AR_REPO }}-mcp --region "$REGION" \
            --format='value(status.url)')
          # /healthz is intercepted by Google Front End on run.app domains (404s
          # before reaching the container); /readyz passes through and also
          # verifies DB connectivity.
          for i in $(seq 1 10); do
            if curl -sfI "$URL/readyz" >/dev/null; then echo "healthy"; exit 0; fi
            sleep 6
          done
          echo "mcp did not become healthy" >&2; exit 1

      - name: Post-deploy smoke turn
        if: inputs.environment == 'staging'
        timeout-minutes: 5
        run: |
          # Deliberately no VM-status precheck and no error-suppressing fallback
          # here (unlike the worker refresh step above): a staging deploy that
          # could not be smoke-verified must fail loudly, not read green. If the
          # workers VM is stopped, the SSH command below fails and so does this step.
          gcloud compute ssh ${{ vars.GCP_AR_REPO }}-workers --zone "$ZONE" \
            --tunnel-through-iap --command '
              export DAIMON_IMAGE="${{ steps.images.outputs.daimon }}"
              export SMOKE_DEPLOY_SHA="${{ inputs.sha }}"
              export DOCKER_CONFIG=/root/.docker
              cd /etc/daimon
              sudo -E docker compose -f compose.worker.yml run --rm smoke
            '

      - name: Let the adapters' boot reconcile settle
        run: |
          # After it starts, each adapter reconciles its installs against the
          # shipped defaults in the background and signals nothing when done;
          # the verify below would read a reconcile still in flight as drift.
          # The notebook-host refresh used to sit between the two and give it a
          # minute or more. It now runs alongside, so keep that margin here.
          [ -f "$RUNNER_TEMP/workers-refreshed-at" ] || exit 0
          wait_s=$(( $(cat "$RUNNER_TEMP/workers-refreshed-at") + 90 - $(date +%s) ))
          if [ "$wait_s" -gt 0 ]; then
            echo "waiting ${wait_s}s"
            sleep "$wait_s"
          fi

      - name: Verify deployed installs match shipped defaults
        # No environment gate, deliberately: this runs on every staging deploy
        # AND every production promote — unlike the smoke turn above, which is
        # scoped to staging only. A production install drifting from the
        # shipped spec is exactly the failure mode this step exists to catch.
        #
        # Own timeout, sized larger than the smoke turn's: this walks every
        # ready install's resources sequentially against the provider, not a
        # single turn, so its budget scales with install count rather than
        # with one turn's latency. Revisit this budget as installs grow.
        timeout-minutes: 10
        env:
          STAGING_QA_TENANT: ${{ vars.STAGING_QA_TENANT }}
        run: |
          # Same failure discipline as the smoke turn step above: no VM-status
          # precheck, no error-suppressing fallback. A deploy whose installs
          # could not be checked against the shipped defaults must fail loudly,
          # not read green — that silent gap is exactly what this step closes.
          verify_tenant_arg=""
          if [ "${{ inputs.environment }}" = staging ] && [ -n "$STAGING_QA_TENANT" ]; then
            # Validate before interpolating into the remote shell command.
            if [[ ! "$STAGING_QA_TENANT" =~ ^[a-z][a-z0-9_-]*:[A-Za-z0-9_-]+$ ]]; then
              echo "Invalid STAGING_QA_TENANT selector" >&2
              exit 2
            fi
            verify_tenant_arg="--warn-tenant $STAGING_QA_TENANT"
          fi
          verify() {
            gcloud compute ssh ${{ vars.GCP_AR_REPO }}-workers --zone "$ZONE" \
              --tunnel-through-iap --command "
                export DAIMON_IMAGE="${{ steps.images.outputs.daimon }}"
                export DOCKER_CONFIG=/root/.docker
                cd /etc/daimon
                sudo -E docker compose -f compose.worker.yml run --rm smoke defaults verify $verify_tenant_arg
              "
          }
          # The settle floor above covers a typical boot reconcile; one retry a
          # minute later covers a slow one. Real drift fails both attempts.
          if ! verify; then
            echo "verify failed; retrying in 60s"
            sleep 60
            verify
          fi

      - name: Mark tested staging images promotable
        if: steps.images.outputs.prebuilt == 'true'
        run: |
          # promote.yml recognizes only the canonical short-SHA daimon tag.
          # Publish that tag last, after all three images and deploy gates pass.
          gcloud artifacts docker tags add "${{ steps.images.outputs.notebook }}" "${{ steps.tags.outputs.notebook }}" --quiet
          gcloud artifacts docker tags add "${{ steps.images.outputs.report }}" "${{ steps.tags.outputs.report }}" --quiet
          gcloud artifacts docker tags add "${{ steps.images.outputs.daimon }}" "${{ steps.tags.outputs.daimon }}" --quiet
