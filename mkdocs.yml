site_name: Daimon
site_description: The open source data science agent for Discord and Slack
site_url: https://pymc-labs.github.io/daimon/
repo_url: https://github.com/pymc-labs/daimon
repo_name: pymc-labs/daimon
edit_uri: edit/main/docs/

# The pages are plain GitHub-readable markdown first: every one of them has to
# make sense in the repository, because that is where a contributor finds them.
# This file only arranges them.
docs_dir: docs
strict: true

nav:
  - Lead intake: lead-intake.md
  - Home: README.md
  - Get started:
      - Quickstart: quickstart.md
  - Self-host:
      - Self-hosting: self-hosting.md
      - Model providers: providers.md
      - Operations: operations.md
  - Connect:
      - Slack: slack.md
      - Microsoft Teams: teams.md
      - GitHub: github.md
      - MCP servers: mcp-servers.md
      - Claude Code plugin: plugin.md
  - Customise:
      - Defaults: defaults.md
      - Routines: routines.md
      - Long jobs: long-jobs.md
      - Lead intake: lead-intake.md
  - Concepts:
      - Architecture: architecture.md
      - Isolation: isolation.md
      - Permissions: permissions.md
      - Billing: billing.md
      - Agent identity: agent-identity.md
      - Managed agents (mux): mux.md
  - Reference:
      - Configuration: configuration.md
      - MCP tools: mcp-tools.md
  - Contributing: https://github.com/pymc-labs/daimon/blob/main/CONTRIBUTING.md

# Every page in docs/ is published, listed or not, so a page left out of the
# nav fails the strict build instead of shipping unreachable.
validation:
  nav:
    omitted_files: warn
  # A link to a heading that was renamed or cut fails the build too.
  anchors: warn

theme:
  name: material
  # The readme's sticker, downscaled, for the header and the sidebar; the
  # favicon is a square crop of its face. Colours live in
  # docs/assets/extra.css.
  logo: assets/daimon-sticker.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        # The architecture guide draws its diagrams in mermaid; without this
        # fence they render as an unstyled code block.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
