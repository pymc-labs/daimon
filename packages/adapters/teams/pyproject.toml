[project]
name = "daimon-adapter-teams"
version = "0.1.0"
description = "Daimon Microsoft Teams adapter"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "PyMC Labs" }]
dependencies = [
    "anthropic>=1.12",
    "asyncpg>=0.29",
    "daimon-core",
    "fastapi>=0.115",
    "httpx>=0.27",
    "microsoft-teams-apps>=2.1,<2.2",
    "pillow>=11,<13",
    "pyjwt>=2.8",
    "sentry-sdk>=2.61",
    "sqlalchemy[asyncio]>=2",
    "structlog>=24",
    "uvicorn>=0.30",
]

[project.scripts]
daimon-teams = "daimon.adapters.teams.__main__:run"

[project.urls]
Repository = "https://github.com/pymc-labs/daimon"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daimon"]
