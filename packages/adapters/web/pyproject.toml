[project]
name = "daimon-adapter-web"
version = "0.1.0"
description = "Daimon web app adapter"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "PyMC Labs" }]
dependencies = [
    "asyncpg>=0.29",
    "daimon-core",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "python-multipart>=0.0.20",
    "sentry-sdk>=2.61",
    "sqlalchemy[asyncio]>=2",
    "structlog>=24",
    "uvicorn>=0.30",
]

[project.scripts]
daimon-web = "daimon.adapters.web.__main__:run"

[project.urls]
Repository = "https://github.com/pymc-labs/daimon"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daimon"]
# The built web app is copied here by the image build and is gitignored.
artifacts = ["daimon/adapters/web/static/**"]
