<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>$title</title>
<style nonce="$nonce">
:root { --bg: #f5f7f9; --card: #fff; --ink: #0c1f40; --mute: #55627a; --line: #e2e6ec; --strong: #ccd3dd; }
@media (prefers-color-scheme: dark) { :root { --bg: #0a1931; --card: #0d1c37; --ink: #edf1f6; --mute: #9ca9bf; --line: #1b2c4b; --strong: #2a3c5f; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: flex; justify-content: center; align-items: flex-start;
  padding: 12vh 24px 24px; background: var(--bg); color: var(--ink);
  font: 14px/1.5 "Inter Variable", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; }
main { width: 100%; max-width: 400px; padding: 32px; text-align: center; background: var(--card);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 2px rgb(0 0 0 / .04); }
img { width: 48px; height: 48px; object-fit: contain; }
h1 { margin: 20px 0 0; font-size: 18px; font-weight: 600; line-height: 1.4; }
p { margin: 6px 0 0; color: var(--mute); overflow-wrap: anywhere; }
p:empty { display: none; }
.action { display: flex; align-items: center; justify-content: center; width: 100%; height: 40px;
  margin-top: 24px; border: 1px solid var(--strong); border-radius: 8px; background: none;
  color: var(--ink); font: inherit; font-weight: 500; text-decoration: none; cursor: pointer; }
.action:hover { background: var(--bg); }
</style>
</head>
<body>
<main>
<img src="/daimon.png" alt="">
<h1>$title</h1>
<p>$text</p>
$action
</main>
<script nonce="$nonce">
(() => {
  "use strict";
  // The address bar's #section never reaches the server: carry it into the sign-in's
  // next, so the reader lands on it. The shell checks the same shape.
  const FRAGMENT = /^#[A-Za-z0-9_.:-]{1,128}$$/;
  const hash = FRAGMENT.exec(location.hash)?.[0] === location.hash ? location.hash : "";
  const next = $next;
  if (next === null) return;
  const signIn = () => location.replace("/signin?next=" + encodeURIComponent(next + hash));
  const action = document.getElementById("switch");
  if (!action) return signIn();
  action.addEventListener("click", async () => {
    action.disabled = true;
    await fetch("/auth/logout", { method: "POST", headers: { "X-Daimon-Web": "1" }, credentials: "same-origin" }).catch(() => null);
    signIn();
  });
})();
</script>
</body>
</html>
