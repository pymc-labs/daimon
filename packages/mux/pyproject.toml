[project]
name = "daimon-mux"
version = "0.2.0"
description = "Mux: provider-agnostic managed-agent interface (Anthropic, OpenAI, Google backends)"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "PyMC Labs" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
]

# One extra per provider driver. Only `mux.drivers.<provider>` imports its SDK.
[project.optional-dependencies]
anthropic = ["anthropic>=0.117"]
openai = ["openai>=2.54.0,<3"]
gemini = ["google-genai>=2.7.0,<3"]

[project.urls]
Repository = "https://github.com/pymc-labs/daimon"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mux"]
