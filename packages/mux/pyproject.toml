[project]
name = "daimon-mux"
version = "0.2.0"
description = "Mux: provider-agnostic managed-agent interface (Anthropic, OpenAI, Google backends)"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "PyMC Labs" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.urls]
Repository = "https://github.com/pymc-labs/daimon"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mux"]
