# pytest settings for running the mux tests with only daimon-mux installed:
#   python -m pytest -c packages/mux/pytest-standalone.ini --rootdir . packages/mux/tests
# The workspace run (`uv run pytest packages/mux`) keeps using the root pyproject.toml; no
# file in this directory is named like an automatic pytest config, so it is never picked up.
[pytest]
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# Same opt-in markers as the root configuration: live and slow tests never run here.
addopts = --import-mode=importlib -m 'not contract and not slow and not judge and not platform_contract'
