id: QA-NEW34-SLACK-CREDENTIAL-AND-APPROVAL-PARITY
title: 'Slack: wrong token keeps the form; approval replies stay in the card''s thread'
friction:
- D11
- D17
set: B
surface: slack
tier: manual
priority: P2
est_turns: 2
setup: []
steps: []
assert: []
human:
- click: 'Slack: ask Daimon to connect an MCP server with a token; submit a wrong
    token in the modal.'
  expect: "Rejected without using up the request; card not 'Received. Saving\u2026\
    '."
- click: 'Slack: trigger an approval card (publish in a rule-held channel) and Approve.'
  expect: The follow-up stays in the card's thread (#560).
- click: 'Slack: as someone other than the asker, press Stop on a running turn.'
  expect: The refusal is visible in the thread, not an ephemeral at channel root (#575).
- click: 'Slack: in a DM thread with the bot, reply inside the thread.'
  expect: Answered in that DM thread, not as a new DM (#574).
- click: 'Slack: ask for a small CSV attached to the answer in a channel where the
    app lacks files:write.'
  expect: A visible 'couldn't attach' line naming the missing permission (#561), not
    a silent loss.
- click: 'Slack: run out the channel budget (driver sets 0.01) and mention twice.'
  expect: Visible refusal naming who can top up; Slack shows remaining budget somewhere.
teardown: []
