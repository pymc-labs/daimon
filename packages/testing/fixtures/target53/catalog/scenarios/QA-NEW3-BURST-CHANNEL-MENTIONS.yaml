id: QA-NEW3-BURST-CHANNEL-MENTIONS
title: three channel mentions within 2 s each get a visible response; none is dropped
friction:
- D2
- D24
- NEW-3
set: A
surface: discord
tier: full
priority: P1
est_turns: 3
setup: []
steps:
- do: new_channel
- do: burst
  interval_s: 1
  texts:
  - 'QA burst 1: reply with exactly the two characters B1 and nothing else.'
  - 'QA burst 2: reply with exactly the two characters B2 and nothing else.'
  - 'QA burst 3: reply with exactly the two characters B3 and nothing else.'
- do: wait_done
  timeout_s: 180
assert:
- kind: no_silent_drop
  turn: 1
  max: 20
- kind: no_silent_drop
  turn: 2
  max: 20
- kind: no_silent_drop
  turn: 3
  max: 20
- kind: text_present
  turn: 1
  pattern: ^\s*\**B1\**\.?\s*$
- kind: text_present
  turn: 2
  pattern: ^\s*\**B2\**\.?\s*$
- kind: text_present
  turn: 3
  pattern: ^\s*\**B3\**\.?\s*$
- kind: text_absent
  turn: 3
  pattern: (?i)too many chats in flight
- kind: text_absent
  turn: 1
  pattern: (?i)context|clarify|refers to|not sure what
- kind: text_absent
  turn: 2
  pattern: (?i)context|clarify|refers to|not sure what
- kind: text_absent
  turn: 3
  pattern: (?i)context|clarify|refers to|not sure what
teardown: []
