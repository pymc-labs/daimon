id: QA-NEW18-SKILL-ADD-YES-PLEASE
title: confirming a chat skill add with 'yes please' adds it (not only a bare 'yes')
friction:
- NEW-18
- F5
set: A
surface: discord
tier: weekly
priority: P1
est_turns: 3
notes: Expected FAIL today (AFFIRMATIVES is an exact set). Turn 3 proves the skill
  is actually usable.
setup: []
steps:
- do: new_channel
- do: admin
  tool: cli
  args: daimon channels rule set discord {guild_id} {channel_id} --readers own --copy-from
    daimon
- do: admin
  tool: cli
  args: daimon channels admins set discord {guild_id} {channel_id} --user {env.qa_user_id}
- do: mention
  file: fixtures/SKILL.md
  text: Add this skill to this channel's agent.
- do: wait_done
- do: thread_reply
  mention: true
  text: yes please
- do: wait_done
- do: thread_reply
  mention: true
  text: What is the QA echo phrase?
- do: wait_done
  timeout_s: 180
assert:
- kind: text_absent
  turn: 2
  pattern: (?i)nothing was added|not added
- kind: cli_check
  cmd: daimon agents --guild {guild_id} get {fork.name}
  expect: qa-echo-skill
- kind: text_present
  turn: 3
  pattern: ECHO-SKILL-OK
- kind: text_absent
  turn: 3
  pattern: (?i)start a new thread|open a new thread|new conversation to use|(isn't|is
    not|aren't|are not) available in this (thread|conversation)
teardown:
- do: admin
  tool: archive_channel_forks
  args:
    channel: '{channel_id}'
