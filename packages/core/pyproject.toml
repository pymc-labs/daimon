[project]
name = "daimon-core"
version = "0.2.0"
description = "Daimon core library (Managed Agents client, stores, turn pipeline)"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "PyMC Labs" }]
dependencies = [
    "daimon-mux[anthropic]",
    "anthropic>=0.117",
    "cachetools>=7,<8",
    "croniter>=6.0,<7",
    "anyio>=4",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "websockets>=15",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "azure-identity>=1.25,<2",
    "azure-storage-blob>=12.27,<13",
    "botocore>=1.40,<2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "cryptography>=43",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "starlette>=0.40",
    "sentry-sdk>=2.61",
    "structlog>=24.1",
    "tenacity>=9.0",
    "PyJWT>=2.8",
    "google-auth>=2,<3",
    "pillow>=11,<13",
    "numpy>=2,<3",
    "python-ulid>=3.1,<4",
]

[project.optional-dependencies]
# Scrubbing real conversations into shareable eval cases. The eval worker image and
# operators who build suites install this extra; other images stay lean. Image OCR
# uses the `tesseract` binary when it is on PATH, and name detection needs a spaCy model
# (see docs/evals.md). graphql-core checks simulated GitHub GraphQL answers.
evals = [
    "faker>=30",
    "graphql-core>=3.2,<4",
    "presidio-analyzer>=2.2,<3",
    "pdfplumber>=0.11,<1",
]

[project.urls]
Repository = "https://github.com/pymc-labs/daimon"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daimon"]
