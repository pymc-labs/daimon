[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["packages/core/tests", "packages/adapters/cli/tests", "packages/adapters/mcp/tests", "packages/adapters/discord/tests", "packages/adapters/scheduler/tests", "packages/adapters/slack/tests", "packages/adapters/teams/tests", "packages/testing/tests", "packages/mux/tests", "tests/integration", "tests/parity", "apps/notebook-host/tests", "apps/report-host/tests"]
addopts = "--import-mode=importlib -m 'not contract and not slow and not judge'"
markers = [
    "judge: manual Codex subscription transcript judge -- excluded by default",
    "contract: live MA API tests -- opt-in only, never gate CI",
    "slow: expensive image distributions or real marimo subprocesses (port 8100-8199) — opt-in",
    "no_cli_local_seed: CLI test manages its own tenant lifecycle -- skip the autouse cli:local seed",
    "fresh_schema: DB test runs DDL -- give it a private throwaway schema instead of the wiped per-worker one",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.7.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "import-linter>=2.0",
    "pre-commit>=4.0",
    "fastmcp>=3.2.4",
    "pyjwt>=2.12.1",
    "daimon-testing",
    "aioresponses>=0.7.9",
    "syrupy>=5.5.3",
    "jsonschema>=4.23",
]
