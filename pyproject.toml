[project]
name = "daimon"
version = "0.2.0"
description = "Self-hostable agent platform on Anthropic Managed Agents (workspace root)"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "PyMC Labs" }]
dependencies = [
    "daimon-core",
    "daimon-adapter-cli",
    "daimon-adapter-mcp",
    "daimon-adapter-discord",
    "daimon-adapter-scheduler",
    "daimon-adapter-slack",
    "daimon-adapter-teams",
]

[project.optional-dependencies]
# Operator deployments that offer Stripe top-ups install this extra so the
# image carries `stripe`; self-hosters without billing skip it and stay lean.
billing = ["daimon-adapter-mcp[billing]"]

[project.urls]
Repository = "https://github.com/pymc-labs/daimon"

[tool.uv.workspace]
members = ["packages/core", "packages/adapters/*", "packages/testing", "packages/mux", "apps/notebook-host", "apps/report-host"]

[tool.uv.sources]
daimon-core = { workspace = true }
daimon-adapter-cli = { workspace = true }
daimon-adapter-mcp = { workspace = true }
daimon-adapter-discord = { workspace = true }
daimon-adapter-scheduler = { workspace = true }
daimon-adapter-slack = { workspace = true }
daimon-adapter-teams = { workspace = true }
daimon-testing = { workspace = true }
daimon-mux = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Skill payloads are shipped to the agent verbatim, not imported by us. The
# matplotlib style under pymc-artifact-style/mpl is vendored upstream from the
# brand report template — reformatting it would silently fork our copy from the
# source it is supposed to mirror.
extend-exclude = ["defaults/skills/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PGH", "ANN401", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Tests favour long, descriptive assert messages over a hard column cap, and
# fake callables in tests may take `Any` where source may not.
"**/tests/**" = ["E501", "ANN401"]

[tool.pyright]
include = ["packages/core/daimon", "packages/adapters/cli/daimon", "packages/adapters/mcp/daimon", "packages/adapters/discord/daimon", "packages/adapters/scheduler/daimon", "packages/adapters/slack/daimon", "packages/testing/daimon", "packages/mux/mux", "apps/notebook-host/src/notebook_host", "apps/report-host/src/report_host"]
stubPath = "typings"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = "error"

[tool.importlinter]
root_packages = ["daimon", "mux", "notebook_host", "report_host"]

[[tool.importlinter.contracts]]
name = "Mux must not import daimon"
type = "forbidden"
source_modules = ["mux"]
forbidden_modules = ["daimon"]

[[tool.importlinter.contracts]]
name = "Core must not import adapters"
type = "forbidden"
source_modules = ["daimon.core"]
forbidden_modules = ["daimon.adapters"]

[[tool.importlinter.contracts]]
name = "Adapters must not import each other"
type = "independence"
modules = ["daimon.adapters.cli", "daimon.adapters.mcp", "daimon.adapters.discord", "daimon.adapters.scheduler", "daimon.adapters.slack"]

[[tool.importlinter.contracts]]
name = "ORM module is private to stores and defaults"
type = "forbidden"
# import-linter cannot say "daimon.core.* except _models": a wildcard that matches
# _models itself makes grimp reject the self-pair. The siblings are enumerated
# instead; packages/core/tests/test_orm_import_contract.py fails when this list
# drifts from the directory.
source_modules = [
    "daimon.adapters",
    "daimon.core.agent_detail_lists",
    "daimon.core.agent_details",
    "daimon.core.agent_guidance",
    "daimon.core.agent_lifecycle",
    "daimon.core.agent_mcp_credentials",
    "daimon.core.answering_map",
    "daimon.core.artifacts",
    "daimon.core.billing",
    "daimon.core.broker",
    "daimon.core.bundle_handle",
    "daimon.core.checkpoint_prompt",
    "daimon.core.config",
    "daimon.core.constants",
    "daimon.core.continuity",
    "daimon.core.credential_env",
    "daimon.core.credential_requests",
    "daimon.core.cron",
    "daimon.core.db",
    "daimon.core.env_file",
    "daimon.core.errors",
    "daimon.core.github_app_auth",
    "daimon.core.github_credentials",
    "daimon.core.github_repo_auth",
    "daimon.core.github_visibility",
    "daimon.core.handoff_context",
    "daimon.core.headless_runner",
    "daimon.core.health",
    "daimon.core.hub_identity",
    "daimon.core.hub_oauth_kv_sweep",
    "daimon.core.ids",
    "daimon.core.logging_setup",
    "daimon.core.ma",
    "daimon.core.ma_identity",
    "daimon.core.ma_resolver",
    "daimon.core.mcp_attach",
    "daimon.core.mcp_auth",
    "daimon.core.mcp_credential_sweep",
    "daimon.core.mcp_oauth",
    "daimon.core.mcp_personal_servers",
    "daimon.core.mcp_token_check",
    "daimon.core.mcp_vault",
    "daimon.core.mcp_vault_janitor",
    "daimon.core.media",
    "daimon.core.memory_resource",
    "daimon.core.message_feedback",
    "daimon.core.models_catalog",
    "daimon.core.notebooks",
    "daimon.core.observability",
    "daimon.core.operation_policy",
    "daimon.core.output_delivery",
    "daimon.core.pending_file_sweeper",
    "daimon.core.posted_controls",
    "daimon.core.pricing",
    "daimon.core.privacy",
    "daimon.core.purge",
    "daimon.core.reader_agent",
    "daimon.core.repo_resource",
    "daimon.core.reports",
    "daimon.core.roster",
    "daimon.core.routing_facts",
    "daimon.core.scheduler",
    "daimon.core.scope",
    "daimon.core.session_compat",
    "daimon.core.session_preparation",
    "daimon.core.session_preparation_stages",
    "daimon.core.session_snapshot",
    "daimon.core.session_update_ops",
    "daimon.core.sessions",
    "daimon.core.setup_conversations",
    "daimon.core.skill_sync",
    "daimon.core.skill_zip",
    "daimon.core.skills",
    "daimon.core.slack_event_dedup_sweep",
    "daimon.core.slack_file_token",
    "daimon.core.slack_files",
    "daimon.core.slack_oauth",
    "daimon.core.smoke",
    "daimon.core.specs",
    "daimon.core.support_escalation",
    "daimon.core.tenant_balance",
    "daimon.core.thread_classifier",
    "daimon.core.thread_naming",
    "daimon.core.thread_participation",
    "daimon.core.turn",
    "daimon.core.turn_keys",
    "daimon.core.turn_origin",
    "daimon.core.usage_recording",
    "daimon.core.usage_sweep",
    "daimon.core.wizard",
    "daimon.core.wizard_sweep",
    "daimon.core.workspace_transfer",
]
forbidden_modules = ["daimon.core._models"]
# Stores are the sanctioned abstraction layer between adapters and the ORM.
# Adapters import stores (allowed); stores import _models (allowed at that layer).
# Suppress the transitive chain so only direct adapter->_models imports are caught.
ignore_imports = [
    "daimon.core.stores.** -> daimon.core._models",
    "daimon.core.defaults.** -> daimon.core._models",
]

[[tool.importlinter.contracts]]
name = "Core must not import testing"
type = "forbidden"
source_modules = ["daimon.core"]
forbidden_modules = ["daimon.testing"]

[[tool.importlinter.contracts]]
name = "CLI admin commands and run must not import each other"
type = "independence"
modules = [
    "daimon.adapters.cli.commands",
    "daimon.adapters.cli.run",
]

[[tool.importlinter.contracts]]
name = "notebook-host must not import daimon"
type = "forbidden"
source_modules = ["notebook_host"]
forbidden_modules = ["daimon"]

[[tool.importlinter.contracts]]
name = "report-host must not import daimon"
type = "forbidden"
source_modules = ["report_host"]
forbidden_modules = ["daimon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["packages/core/tests", "packages/adapters/cli/tests", "packages/adapters/mcp/tests", "packages/adapters/discord/tests", "packages/adapters/scheduler/tests", "packages/adapters/slack/tests", "packages/testing/tests", "packages/mux/tests", "tests/integration", "tests/parity", "apps/notebook-host/tests", "apps/report-host/tests"]
addopts = "--import-mode=importlib -m 'not contract and not slow'"
markers = [
    "contract: live MA API tests -- opt-in only, never gate CI",
    "slow: spawns real marimo subprocesses (port 8100-8199) — opt-in",
    "no_cli_local_seed: CLI test manages its own tenant lifecycle -- skip the autouse cli:local seed",
    "fresh_schema: DB test runs DDL -- give it a private throwaway schema instead of the wiped per-worker one",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.7.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "import-linter>=2.0",
    "pre-commit>=4.0",
    "fastmcp>=3.2.4",
    "pyjwt>=2.12.1",
    "daimon-testing",
    "aioresponses>=0.7.9",
    "syrupy>=5.5.3",
]
