[project]
name = "daimon"
version = "0.2.0"
description = "Self-hostable agent platform on Anthropic Managed Agents (workspace root)"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "PyMC Labs" }]
dependencies = [
    "daimon-core",
    "daimon-adapter-cli",
    "daimon-adapter-mcp",
    "daimon-adapter-discord",
    "daimon-adapter-scheduler",
    "daimon-adapter-slack",
    "daimon-adapter-teams",
]

[project.optional-dependencies]
# Operator deployments that offer Stripe top-ups install this extra so the
# image carries `stripe`; self-hosters without billing skip it and stay lean.
billing = ["daimon-adapter-mcp[billing]"]

[project.urls]
Repository = "https://github.com/pymc-labs/daimon"

[tool.uv.workspace]
members = ["packages/core", "packages/adapters/*", "packages/testing", "packages/mux", "apps/notebook-host", "apps/report-host"]

[tool.uv.sources]
daimon-core = { workspace = true }
daimon-adapter-cli = { workspace = true }
daimon-adapter-mcp = { workspace = true }
daimon-adapter-discord = { workspace = true }
daimon-adapter-scheduler = { workspace = true }
daimon-adapter-slack = { workspace = true }
daimon-adapter-teams = { workspace = true }
daimon-testing = { workspace = true }
daimon-mux = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Skill payloads are shipped to the agent verbatim, not imported by us. The
# matplotlib style under pymc-artifact-style/mpl is vendored upstream from the
# brand report template — reformatting it would silently fork our copy from the
# source it is supposed to mirror.
extend-exclude = ["defaults/skills/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PGH", "ANN401", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Tests favour long, descriptive assert messages over a hard column cap, and
# fake callables in tests may take `Any` where source may not.
"**/tests/**" = ["E501", "ANN401"]

[tool.pyright]
include = ["packages/core/daimon", "packages/adapters/cli/daimon", "packages/adapters/mcp/daimon", "packages/adapters/discord/daimon", "packages/adapters/scheduler/daimon", "packages/adapters/slack/daimon", "packages/adapters/teams/daimon", "packages/testing/daimon", "packages/mux/mux", "apps/notebook-host/src/notebook_host", "apps/report-host/src/report_host"]
stubPath = "typings"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = "error"

[tool.importlinter]
root_packages = ["daimon", "mux", "notebook_host", "report_host"]
# External packages are in the graph so the mux contracts can forbid provider SDKs.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Mux must not import daimon"
type = "forbidden"
source_modules = ["mux"]
forbidden_modules = ["daimon"]

# The provider-neutral layer: no SDK, and no driver that could bring one in.
[[tool.importlinter.contracts]]
name = "Mux contracts and profiles import no provider SDK or driver"
type = "forbidden"
source_modules = ["mux.contracts", "mux.profiles", "mux.errors", "mux.state", "mux.conformance.budget", "mux.conformance.live_probe", "mux.conformance.recording", "mux.conformance.default_capability"]
forbidden_modules = ["anthropic", "openai", "google", "mux.drivers"]

# Each SDK is imported by its own driver and nowhere else in mux. The ignores
# name drivers that do not exist yet, so unmatched ignores stay silent.
[[tool.importlinter.contracts]]
name = "Only mux.drivers.anthropic imports the anthropic SDK"
type = "forbidden"
source_modules = ["mux"]
forbidden_modules = ["anthropic"]
ignore_imports = ["mux.drivers.anthropic -> anthropic", "mux.drivers.anthropic.** -> anthropic"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Only mux.drivers.openai imports the openai SDK"
type = "forbidden"
source_modules = ["mux"]
forbidden_modules = ["openai"]
ignore_imports = ["mux.drivers.openai -> openai", "mux.drivers.openai.** -> openai"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Only mux.drivers.gemini imports the google.genai SDK"
type = "forbidden"
source_modules = ["mux"]
forbidden_modules = ["google"]
ignore_imports = ["mux.drivers.gemini -> google", "mux.drivers.gemini.** -> google"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Core must not import adapters"
type = "forbidden"
source_modules = ["daimon.core"]
forbidden_modules = ["daimon.adapters"]

[[tool.importlinter.contracts]]
name = "Adapters must not import each other"
type = "independence"
modules = ["daimon.adapters.cli", "daimon.adapters.mcp", "daimon.adapters.discord", "daimon.adapters.scheduler", "daimon.adapters.slack", "daimon.adapters.teams"]

[[tool.importlinter.contracts]]
name = "ORM module is private to stores and defaults"
type = "forbidden"
# import-linter cannot say "daimon.core.* except _models": a wildcard that matches
