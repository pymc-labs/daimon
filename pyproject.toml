[project]
name = "daimon"
version = "0.2.0"
description = "Self-hostable agent platform on Anthropic Managed Agents (workspace root)"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "PyMC Labs" }]
dependencies = [
    "daimon-core",
    "daimon-data",
    "daimon-mux[openai]",
    "daimon-adapter-cli",
    "daimon-adapter-mcp",
    "daimon-adapter-discord",
    "daimon-adapter-scheduler",
    "daimon-adapter-sidecar",
    "daimon-adapter-slack",
    "daimon-adapter-teams",
    "daimon-adapter-web",
]

[project.optional-dependencies]
# Operator deployments that offer Stripe top-ups install this extra so the
# image carries `stripe`; self-hosters without billing skip it and stay lean.
billing = ["daimon-adapter-mcp[billing]"]
# Operator deployments that run agents on Gemini install this extra so the image
# carries the Gemini SDK pin the driver needs.
gemini = ["daimon-mux[gemini]"]

[project.urls]
Repository = "https://github.com/pymc-labs/daimon"

[tool.uv.workspace]
members = ["packages/core", "packages/data", "packages/adapters/*", "packages/testing", "packages/mux", "apps/notebook-host", "apps/report-host", "apps/harness", "apps/compute-session"]

[tool.uv.sources]
daimon-core = { workspace = true }
daimon-data = { workspace = true }
daimon-adapter-cli = { workspace = true }
daimon-adapter-mcp = { workspace = true }
daimon-adapter-discord = { workspace = true }
daimon-adapter-scheduler = { workspace = true }
daimon-adapter-sidecar = { workspace = true }
daimon-adapter-slack = { workspace = true }
daimon-adapter-teams = { workspace = true }
daimon-adapter-web = { workspace = true }
daimon-testing = { workspace = true }
daimon-mux = { workspace = true }
daimon-harness = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Skill payloads are shipped to the agent verbatim, not imported by us. The
# matplotlib style under pymc-artifact-style/mpl is vendored upstream from the
# brand report template — reformatting it would silently fork our copy from the
# source it is supposed to mirror.
extend-exclude = ["defaults/skills/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PGH", "ANN401", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Tests favour long, descriptive assert messages over a hard column cap, and
# fake callables in tests may take `Any` where source may not.
"**/tests/**" = ["E501", "ANN401"]

[tool.pyright]
exclude = ["qa/live/tests"]
include = ["qa/live", "packages/core/daimon", "packages/data/daimon", "packages/adapters/cli/daimon", "packages/adapters/mcp/daimon", "packages/adapters/discord/daimon", "packages/adapters/scheduler/daimon", "packages/adapters/slack/daimon", "packages/adapters/teams/daimon", "packages/adapters/web/daimon", "packages/adapters/sidecar/daimon", "packages/testing/daimon", "packages/mux/mux", "apps/notebook-host/src/notebook_host", "apps/report-host/src/report_host", "apps/harness/src/daimon_harness", "apps/compute-session/src/compute_session"]
stubPath = "typings"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = "error"

[tool.importlinter]
root_packages = ["daimon", "mux", "notebook_host", "report_host", "daimon_harness", "compute_session"]
# External packages are in the graph so the mux contracts can forbid provider SDKs.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Mux must not import daimon"
type = "forbidden"
source_modules = ["mux"]
forbidden_modules = ["daimon"]

# The provider-neutral layer: no SDK, and no driver that could bring one in.
[[tool.importlinter.contracts]]
name = "Mux contracts and profiles import no provider SDK or driver"
type = "forbidden"
source_modules = ["mux.contracts", "mux.profiles", "mux.errors", "mux.state"]
forbidden_modules = ["anthropic", "openai", "google", "mux.drivers"]

# Each SDK is imported by its own driver, by that provider's test doubles under
# `mux.testing.drivers.<provider>`, and by `mux.testing.isolated_sdk` (the one
# module that builds SDK clients for every provider), and nowhere else in mux.
# Unmatched ignores stay silent.
[[tool.importlinter.contracts]]
name = "Only mux.drivers.anthropic imports the anthropic SDK"
type = "forbidden"
source_modules = ["mux"]
forbidden_modules = ["anthropic"]
ignore_imports = [
    "mux.drivers.anthropic -> anthropic",
    "mux.drivers.anthropic.** -> anthropic",
    "mux.testing.drivers.anthropic -> anthropic",
    "mux.testing.drivers.anthropic.** -> anthropic",
    "mux.testing.isolated_sdk -> anthropic",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Only mux.drivers.openai imports the openai SDK"
type = "forbidden"
source_modules = ["mux"]
forbidden_modules = ["openai"]
ignore_imports = [
    "mux.drivers.openai -> openai",
    "mux.drivers.openai.** -> openai",
    "mux.testing.drivers.openai -> openai",
    "mux.testing.drivers.openai.** -> openai",
    "mux.testing.isolated_sdk -> openai",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Only mux.drivers.gemini imports the google.genai SDK"
type = "forbidden"
source_modules = ["mux"]
forbidden_modules = ["google"]
ignore_imports = [
    "mux.drivers.gemini -> google",
    "mux.drivers.gemini.** -> google",
    "mux.testing.drivers.gemini -> google",
    "mux.testing.drivers.gemini.** -> google",
    "mux.testing.isolated_sdk -> google",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Core must not import adapters"
type = "forbidden"
source_modules = ["daimon.core"]
forbidden_modules = ["daimon.adapters"]

[[tool.importlinter.contracts]]
name = "Core must not import the data store"
type = "forbidden"
source_modules = ["daimon.core"]
forbidden_modules = ["daimon.data"]

# The data store reaches core through settings, stores and the ports core defines for it.
[[tool.importlinter.contracts]]
name = "The data store reaches core only through settings, stores and ports"
type = "forbidden"
source_modules = ["daimon.data"]
forbidden_modules = ["daimon.core"]
allow_indirect_imports = true
ignore_imports = [
    "daimon.data.** -> daimon.core.config",
    "daimon.data.** -> daimon.core.stores",
    "daimon.data.** -> daimon.core.stores.**",
    "daimon.data.** -> daimon.core.ports",
    "daimon.data.** -> daimon.core.ports.**",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "The data store must not import adapters"
type = "forbidden"
source_modules = ["daimon.data"]
forbidden_modules = ["daimon.adapters"]

[[tool.importlinter.contracts]]
name = "Adapters must not import each other"
type = "independence"
modules = ["daimon.adapters.cli", "daimon.adapters.mcp", "daimon.adapters.discord", "daimon.adapters.scheduler", "daimon.adapters.sidecar", "daimon.adapters.slack", "daimon.adapters.teams", "daimon.adapters.web"]

[[tool.importlinter.contracts]]
name = "Core must not import testing"
type = "forbidden"
source_modules = ["daimon.core"]
forbidden_modules = ["daimon.testing"]

# Expand package members explicitly so mux.testing is excluded while the
# mux initializer itself remains covered. The boundary regression inventories
# mux siblings so a new top-level package cannot silently escape this list.
[[tool.importlinter.contracts]]
name = "Product code must not import test harnesses"
type = "forbidden"
source_modules = [
    "daimon.core", "daimon.core.**",
    "daimon.data", "daimon.data.**",
    "daimon.adapters", "daimon.adapters.**",
    "mux", "mux.contracts", "mux.contracts.**",
    "mux.drivers", "mux.drivers.**", "mux.errors",
    "mux.profiles", "mux.profiles.**", "mux.state", "mux.state.**",
]
forbidden_modules = ["mux.testing", "mux.testing.**", "daimon.testing", "daimon.testing.**"]
as_packages = false

[[tool.importlinter.contracts]]
name = "CLI admin commands and run must not import each other"
type = "independence"
modules = [
    "daimon.adapters.cli.commands",
    "daimon.adapters.cli.run",
]

[[tool.importlinter.contracts]]
name = "notebook-host must not import daimon"
type = "forbidden"
source_modules = ["notebook_host"]
forbidden_modules = ["daimon"]

[[tool.importlinter.contracts]]
name = "report-host must not import daimon"
type = "forbidden"
source_modules = ["report_host"]
forbidden_modules = ["daimon"]

[[tool.importlinter.contracts]]
name = "harness must not import daimon"
type = "forbidden"
source_modules = ["daimon_harness"]
forbidden_modules = ["daimon"]

# The session image carries this package alone, and its machine runs untrusted commands.
[[tool.importlinter.contracts]]
name = "compute-session must not import daimon"
type = "forbidden"
source_modules = ["compute_session"]
forbidden_modules = ["daimon", "mux"]

# Daimon reaches a provider driver through its package (`mux.drivers.<provider>`),
# whose `__all__` is the host-facing API; the driver's submodules and private
# modules are not an import path. The ignores are the names that stay on a
# submodule because a package-level export would add a generic name:
# openai `KEY` and `reserved`, gemini `credential`, and selfhosted `segment` and
# `usage`. `mux.drivers.selfhosted.wire` is a documented public module.
[[tool.importlinter.contracts]]
name = "Daimon product code imports provider drivers through their packages"
type = "forbidden"
source_modules = ["daimon.core", "daimon.adapters"]
forbidden_modules = [
    "mux.drivers.anthropic.**",
    "mux.drivers.openai.**",
    "mux.drivers.gemini.**",
    "mux.drivers.selfhosted.**",
    "mux.contracts._base",
]
allow_indirect_imports = true
ignore_imports = [
    "daimon.core.turn.gemini_deployment -> mux.drivers.gemini.mcp_auth",
    # `mux.drivers.selfhosted.wire` is public (the daimon-harness/0 protocol).
    "daimon.core.** -> mux.drivers.selfhosted.wire",
    # Generic names (`segment`, `usage`) that stay on their submodule.
    "daimon.core.turn.selfhosted_deployment -> mux.drivers.selfhosted.events",
    "daimon.core.turn.selfhosted_deployment -> mux.drivers.selfhosted.normalize",
    # The Gemini records-row contract, for the storage backends that implement it.
    "daimon.core.turn.gemini_state -> mux.drivers.gemini.storage",
    "daimon.core.turn.gemini_retention -> mux.drivers.gemini.storage",
    "daimon.core.stores.gemini_runtime_state -> mux.drivers.gemini.storage",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests/golden"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["qa/live/tests", "packages/core/tests", "packages/data/tests", "packages/adapters/cli/tests", "packages/adapters/mcp/tests", "packages/adapters/discord/tests", "packages/adapters/scheduler/tests", "packages/adapters/slack/tests", "packages/adapters/teams/tests", "packages/adapters/web/tests", "packages/adapters/sidecar/tests", "packages/testing/tests", "packages/mux/tests", "tests", "apps/notebook-host/tests", "apps/report-host/tests", "apps/harness/tests", "apps/compute-session/tests"]
addopts = "--import-mode=importlib -m 'not contract and not slow and not judge and not platform_contract'"
markers = [
    "judge: manual Codex subscription transcript judge -- excluded by default",
    "contract: live MA API tests -- opt-in only, never gate CI",
    "platform_contract: sends every Slack and Discord payload to the real platform validators -- opt-in, needs QA bot tokens, never gates CI",
    "slow: expensive image distributions or real marimo subprocesses (port 8100-8199) — opt-in",
    "no_cli_local_seed: CLI test manages its own tenant lifecycle -- skip the autouse cli:local seed",
    "fresh_schema: DB test runs DDL -- give it a private throwaway schema instead of the wiped per-worker one",
]

[dependency-groups]
mux-test = ["daimon-mux[anthropic,openai,gemini]", "daimon-testing"]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.7.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "import-linter>=2.0",
    "pre-commit>=4.0",
    "fastmcp>=3.2.4",
    "pyjwt>=2.12.1",
    "msal>=1.39.0",
    "google-cloud-secret-manager>=2.25.0",
    # Newer google-api-core needs a newer opentelemetry-api than the runtime lock pins.
    "google-api-core<2.30",
    "daimon-testing",
    "aioresponses>=0.7.9",
    "syrupy>=5.5.3",
    "jsonschema>=4.23",
    "pytest-timeout>=2.3",
    "hypothesis>=6.150,<7",
]
