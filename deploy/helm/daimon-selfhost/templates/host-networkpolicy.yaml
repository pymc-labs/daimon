{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "d.name" . }}-host-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          {{- range $name := list "init" "mcp" "teams" "scheduler" "discord" "slack" }}
          - {{ include "d.name" $ }}-{{ $name }}
          {{- end }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- if .Values.postgres.bundled }}
    - to:
        - podSelector: {matchLabels: {app: {{ include "d.name" . }}-postgres}}
      ports: [{protocol: TCP, port: 5432}]
    {{- else if .Values.networkPolicy.hostPostgresCidrs }}
    - to:
        {{- range $cidr := .Values.networkPolicy.hostPostgresCidrs }}
        {{- if or (not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/32$" $cidr)) (eq $cidr "169.254.169.254/32") }}
        {{- fail "External PostgreSQL destinations must be IPv4 /32 endpoint addresses, excluding IMDS" }}
        {{- end }}
        - ipBlock: {cidr: {{ $cidr }}}
        {{- end }}
      ports: [{protocol: TCP, port: {{ .Values.postgres.port }}}]
    {{- end }}
    - to:
        - podSelector: {matchLabels: {app: {{ include "d.name" . }}-mcp}}
      ports: [{protocol: TCP, port: {{ .Values.services.mcp.port }}}]
    - to:
        - podSelector: {matchLabels: {app: {{ include "d.name" . }}-harness}}
      ports: [{protocol: TCP, port: 8088}]
{{- end }}

{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.teamsEgress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "d.name" . }}-teams-egress
spec:
  podSelector: {matchLabels: {app: {{ include "d.name" . }}-teams}}
  policyTypes: [Egress]
  egress:
    - to:
        {{- range $cidr := required "teamsEgress.cidrs must contain Bot Framework/Entra endpoint /32s" .Values.networkPolicy.teamsEgress.cidrs }}
        {{- if or (not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/32$" $cidr)) (eq $cidr "169.254.169.254/32") }}
        {{- fail "Teams destinations must be IPv4 /32 endpoint addresses, excluding IMDS" }}
        {{- end }}
        - ipBlock: {cidr: {{ $cidr }}}
        {{- end }}
      ports: [{protocol: TCP, port: 443}]
{{- end }}
