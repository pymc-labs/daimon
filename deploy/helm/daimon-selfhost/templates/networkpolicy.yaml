{{- if and .Values.networkPolicy.enabled .Values.harness.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "d.name" . }}-harness}
spec:
  podSelector:
    matchLabels: {app: {{ include "d.name" . }}-harness}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range $name := list "mcp" "teams" "scheduler" "discord" "slack" }}
        - podSelector:
            matchLabels: {app: {{ include "d.name" $ }}-{{ $name }}}
        {{- end }}
      ports: [{protocol: TCP, port: 8088}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels: {app: {{ include "d.name" . }}-mcp}
      ports: [{protocol: TCP, port: {{ .Values.services.mcp.port }}}]
    {{- $cidrs := concat .Values.networkPolicy.azureOpenAICidrs .Values.networkPolicy.blobCidrs }}
    {{- if .Values.harness.miProxy.enabled }}{{ $cidrs = concat $cidrs .Values.networkPolicy.entraCidrs }}{{ end }}
    {{- if $cidrs }}
    - to:
        {{- range $cidr := $cidrs }}
        {{- if or (not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/32$" $cidr)) (eq $cidr "169.254.169.254/32") }}
        {{- fail "Egress destinations must be IPv4 /32 endpoint addresses, excluding IMDS" }}
        {{- end }}
        - ipBlock:
            cidr: {{ $cidr }}
        {{- end }}
      ports: [{protocol: TCP, port: 443}]
    {{- end }}
{{- end }}
