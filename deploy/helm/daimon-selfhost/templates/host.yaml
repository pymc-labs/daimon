{{- $root := . }}
{{- range $name := list "init" "mcp" "teams" "scheduler" "discord" "slack" }}
{{- $init := eq $name "init" }}
{{- $svc := dict "enabled" $.Values.init.enabled "env" dict "port" 0 }}
{{- if not $init }}{{ $svc = index $.Values.services $name }}{{ end }}
{{- if and $svc.enabled (or $init $.Values.services.enabled) }}
---
apiVersion: {{ ternary "batch/v1" "apps/v1" $init }}
kind: {{ ternary "Job" "Deployment" $init }}
metadata:
  name: {{ include "d.name" $ }}-{{ $name }}{{ if $init }}-{{ $.Release.Revision }}{{ end }}
spec:
  {{- if $init }}
  backoffLimit: {{ $.Values.init.backoffLimit }}
  activeDeadlineSeconds: {{ $.Values.init.activeDeadlineSeconds }}
  {{- else }}
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ include "d.name" $ }}-{{ $name }}}
  {{- end }}
  template:
    metadata:
      labels: {app: {{ include "d.name" $ }}-{{ $name }}}
    spec:
      {{- if $init }}
      restartPolicy: Never
      {{- end }}
      terminationGracePeriodSeconds: 90
      automountServiceAccountToken: false
      imagePullSecrets: {{ $.Values.imagePullSecrets | toJson }}
      initContainers:
        - name: prepare-host-ca
          image: {{ include "d.image" (dict "root" $ "image" $.Values.images.host) | quote }}
          imagePullPolicy: {{ $.Values.images.host.pullPolicy }}
          command: [python, -c]
          args:
            - "import certifi; from pathlib import Path; Path('/target/ca-bundle.crt').write_bytes(Path(certifi.where()).read_bytes() + bytes([10]) + Path('/source/ca.crt').read_bytes())"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: host-ca-source, mountPath: /source, readOnly: true}
            - {name: host-ca, mountPath: /target}
        - name: wait-for-postgres
          image: {{ include "d.image" (dict "root" $ "image" $.Values.images.postgres) | quote }}
          imagePullPolicy: {{ $.Values.images.postgres.pullPolicy }}
          command: [sh, -ec]
          args:
            - >-
              echo 'Waiting for PostgreSQL to accept connections';
              timeout {{ $.Values.postgres.waitTimeoutSeconds }} sh -ec
              'until pg_isready -t 2; do sleep 2; done';
              echo 'PostgreSQL accepts connections'
          env:
            {{- if $.Values.postgres.bundled }}
            - {name: PGHOST, value: {{ printf "%s-postgres" (include "d.name" $) | quote }}}
            {{- else }}
            - {name: PGHOST, value: {{ required "postgres.host is required when bundled=false" $.Values.postgres.host | quote }}}
            {{- end }}
            - {name: PGPORT, value: {{ $.Values.postgres.port | quote }}}
            - {name: PGUSER, value: {{ $.Values.postgres.user | quote }}}
            - {name: PGDATABASE, value: {{ $.Values.postgres.database | quote }}}
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
        {{- if not $init }}
        - name: wait-for-migrations
          image: {{ include "d.image" (dict "root" $ "image" $.Values.images.host) | quote }}
          imagePullPolicy: {{ $.Values.images.host.pullPolicy }}
          command: [sh, -ec]
          args:
            - >-
              echo 'Waiting for the packaged Alembic heads';
              timeout {{ $.Values.init.activeDeadlineSeconds }} sh -ec
              'until alembic current --check-heads; do sleep 2; done';
              echo 'Database schema is current'
          envFrom:
            - secretRef: {name: {{ $.Values.secrets.host }}}
          env:
            - {name: PGSSLROOTCERT, value: /etc/ssl/certs/ca-certificates.crt}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          {{- include "d.csiMount" $ | nindent 10 }}
        {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "d.image" (dict "root" $ "image" $.Values.images.host) | quote }}
          imagePullPolicy: {{ $.Values.images.host.pullPolicy }}
          {{- if $init }}
          command: [sh, -ec, "alembic upgrade head && daimon defaults apply"]
          {{- else if eq $name "mcp" }}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [SETUID, SETGID]}
            seccompProfile: {type: RuntimeDefault}
          command: [python, -c]
          args:
            - >-
              import os, pwd, uvicorn;
              os.environ['HOME'] = pwd.getpwuid(1000).pw_dir;
              config = uvicorn.Config('daimon.adapters.mcp.server:create_mcp_app', factory=True, host='0.0.0.0', port={{ $svc.port }}, ssl_keyfile='/etc/daimon/mcp-tls/tls.key', ssl_certfile='/etc/daimon/mcp-tls/tls.crt');
              config.load(); os.setgroups([]); os.setgid(1000); os.setuid(1000);
              uvicorn.Server(config).run()
          {{- else if eq $name "scheduler" }}
          command: [daimon-scheduler]
          {{- else }}
          command: [python, -m, "daimon.adapters.{{ $name }}"]
          {{- end }}
          envFrom:
            - secretRef: {name: {{ $.Values.secrets.host }}}
          env:
            - {name: PGSSLROOTCERT, value: /etc/ssl/certs/ca-certificates.crt}
            {{- $hostEnv := mergeOverwrite (deepCopy $.Values.host.env) $svc.env }}
            {{- $_ := set $hostEnv "SSL_CERT_FILE" "/etc/daimon/ca/ca-bundle.crt" }}
            {{- if eq $name "scheduler" }}{{ $_ := set $hostEnv "DAIMON_SCHEDULER__HEALTH_PORT" (toString $svc.port) }}{{ end }}
            {{- if eq $name "discord" }}{{ $_ := set $hostEnv "DAIMON_DISCORD__HEALTH_PORT" (toString $svc.port) }}{{ end }}
            {{- if eq $name "teams" }}{{ $_ := set $hostEnv "DAIMON_TEAMS__PORT" (toString $svc.port) }}{{ end }}
            {{- if $.Values.host.runtimeSecret }}
            {{- $_ := set $hostEnv "DAIMON_TURN__PROVIDER_RUNTIME_FILE" "/etc/daimon-runtime/runtime.json" }}
            {{- end }}
            {{- range $key, $value := $hostEnv }}
            - {name: {{ $key }}, value: {{ $value | quote }}}
            {{- end }}
          resources: {{ $.Values.host.resources | toJson }}
          {{- if $svc.port }}
          ports: [{containerPort: {{ $svc.port }}}]
          startupProbe:
            httpGet: {path: {{ $svc.healthPath }}, port: {{ $svc.port }}, scheme: {{ ternary "HTTPS" "HTTP" (eq $name "mcp") }}}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: {{ $svc.healthPath }}, port: {{ $svc.port }}, scheme: {{ ternary "HTTPS" "HTTP" (eq $name "mcp") }}}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: {{ default $svc.healthPath $svc.readyPath }}, port: {{ $svc.port }}, scheme: {{ ternary "HTTPS" "HTTP" (eq $name "mcp") }}}
            initialDelaySeconds: 5
          {{- end }}
          volumeMounts:
            - {name: host-ca, mountPath: /etc/daimon/ca, readOnly: true}
            {{- if eq $name "mcp" }}
            - {name: mcp-tls, mountPath: /etc/daimon/mcp-tls, readOnly: true}
            {{- end }}
            {{- if $.Values.host.runtimeSecret }}
            - {name: runtime, mountPath: /etc/daimon-runtime, readOnly: true}
            {{- end }}
            {{- if $.Values.keyVaultCSI.enabled }}
            - {name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true}
            {{- end }}
      volumes:
        - {name: host-ca, emptyDir: {}}
        - name: host-ca-source
          secret:
            secretName: {{ include "d.mcpTLSSecret" $ }}
            items: [{key: ca.crt, path: ca.crt}]
        {{- if eq $name "mcp" }}
        - name: mcp-tls
          secret:
            secretName: {{ include "d.mcpTLSSecret" $ }}
            defaultMode: 0400
        {{- end }}
        {{- if $.Values.host.runtimeSecret }}
        - name: runtime
          secret:
            secretName: {{ $.Values.host.runtimeSecret }}
            items: [{key: runtime.json, path: runtime.json}]
        {{- end }}
        {{- if $.Values.keyVaultCSI.enabled }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ required "keyVaultCSI.secretProviderClass required" $.Values.keyVaultCSI.secretProviderClass }}
        {{- end }}
{{- if $svc.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "d.name" $ }}-{{ $name }}
spec:
  type: ClusterIP
  selector: {app: {{ include "d.name" $ }}-{{ $name }}}
  ports: [{port: {{ $svc.port }}, targetPort: {{ $svc.port }}}]
{{- end }}
{{- end }}
{{- end }}
