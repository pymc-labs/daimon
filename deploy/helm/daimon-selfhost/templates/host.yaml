{{- $root := . }}
{{- range $name := list "init" "mcp" "teams" "scheduler" "discord" "slack" }}
{{- $init := eq $name "init" }}
{{- $svc := dict "enabled" $.Values.init.enabled "env" dict "port" 0 }}
{{- if not $init }}{{ $svc = index $.Values.services $name }}{{ end }}
{{- if and $svc.enabled (or $init $.Values.services.enabled) }}
---
apiVersion: {{ ternary "batch/v1" "apps/v1" $init }}
kind: {{ ternary "Job" "Deployment" $init }}
metadata:
  name: {{ include "d.name" $ }}-{{ $name }}{{ if $init }}-{{ $.Release.Revision }}{{ end }}
spec:
  {{- if $init }}
  backoffLimit: {{ $.Values.init.backoffLimit }}
  activeDeadlineSeconds: {{ $.Values.init.activeDeadlineSeconds }}
  {{- else }}
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ include "d.name" $ }}-{{ $name }}}
  {{- end }}
  template:
    metadata:
      labels: {app: {{ include "d.name" $ }}-{{ $name }}}
    spec:
      {{- if $init }}
      restartPolicy: Never
      {{- end }}
      automountServiceAccountToken: false
      imagePullSecrets: {{ $.Values.imagePullSecrets | toJson }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "d.image" (dict "root" $ "image" $.Values.images.postgres) | quote }}
          imagePullPolicy: {{ $.Values.images.postgres.pullPolicy }}
          command: [sh, -ec]
          args:
            - >-
              echo 'Waiting for PostgreSQL to accept connections';
              timeout {{ $.Values.postgres.waitTimeoutSeconds }} sh -ec
              'until pg_isready -q -t 2; do sleep 2; done';
              echo 'PostgreSQL accepts connections'
          env:
            {{- if $.Values.postgres.bundled }}
            - {name: PGHOST, value: {{ printf "%s-postgres" (include "d.name" $) | quote }}}
            {{- else }}
            - {name: PGHOST, value: {{ required "postgres.host is required when bundled=false" $.Values.postgres.host | quote }}}
            {{- end }}
            - {name: PGPORT, value: {{ $.Values.postgres.port | quote }}}
            - {name: PGUSER, value: {{ $.Values.postgres.user | quote }}}
            - {name: PGDATABASE, value: {{ $.Values.postgres.database | quote }}}
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
        {{- if not $init }}
        - name: wait-for-migrations
          image: {{ include "d.image" (dict "root" $ "image" $.Values.images.host) | quote }}
          imagePullPolicy: {{ $.Values.images.host.pullPolicy }}
          command: [sh, -ec]
          args:
            - >-
              echo 'Waiting for the packaged Alembic heads';
              timeout {{ $.Values.init.activeDeadlineSeconds }} sh -ec
              'until alembic current --check-heads >/dev/null 2>&1; do sleep 2; done';
              echo 'Database schema is current'
          envFrom:
            - secretRef: {name: {{ $.Values.secrets.host }}}
          env:
            - {name: PGSSLROOTCERT, value: /etc/ssl/certs/ca-certificates.crt}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          {{- include "d.csiMount" $ | nindent 10 }}
        {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "d.image" (dict "root" $ "image" $.Values.images.host) | quote }}
          imagePullPolicy: {{ $.Values.images.host.pullPolicy }}
          {{- if $init }}
          command: [sh, -ec, "alembic upgrade head && daimon defaults apply"]
          {{- else if eq $name "mcp" }}
          command: [uvicorn, "daimon.adapters.mcp.server:create_mcp_app", --factory, --host, 0.0.0.0, --port, {{ $svc.port | quote }}]
          {{- else if eq $name "scheduler" }}
          command: [daimon-scheduler]
          {{- else }}
          command: [python, -m, "daimon.adapters.{{ $name }}"]
          {{- end }}
          envFrom:
            - secretRef: {name: {{ $.Values.secrets.host }}}
          env:
            - {name: PGSSLROOTCERT, value: /etc/ssl/certs/ca-certificates.crt}
            {{- $hostEnv := mergeOverwrite (deepCopy $.Values.host.env) $svc.env }}
            {{- if $.Values.host.runtimeSecret }}
            {{- $_ := set $hostEnv "DAIMON_TURN__PROVIDER_RUNTIME_FILE" "/etc/daimon-runtime/runtime.json" }}
            {{- end }}
            {{- range $key, $value := $hostEnv }}
            - {name: {{ $key }}, value: {{ $value | quote }}}
            {{- end }}
          resources: {{ $.Values.host.resources | toJson }}
          {{- if $svc.port }}
          ports: [{containerPort: {{ $svc.port }}}]
          readinessProbe:
            httpGet: {path: {{ $svc.healthPath }}, port: {{ $svc.port }}}
            initialDelaySeconds: 5
          {{- end }}
          {{- if or $.Values.host.runtimeSecret $.Values.keyVaultCSI.enabled }}
          volumeMounts:
            {{- if $.Values.host.runtimeSecret }}
            - {name: runtime, mountPath: /etc/daimon-runtime, readOnly: true}
            {{- end }}
            {{- if $.Values.keyVaultCSI.enabled }}
            - {name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true}
            {{- end }}
          {{- end }}
      {{- if or $.Values.host.runtimeSecret $.Values.keyVaultCSI.enabled }}
      volumes:
        {{- if $.Values.host.runtimeSecret }}
        - name: runtime
          secret:
            secretName: {{ $.Values.host.runtimeSecret }}
            items: [{key: runtime.json, path: runtime.json}]
        {{- end }}
        {{- if $.Values.keyVaultCSI.enabled }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ required "keyVaultCSI.secretProviderClass required" $.Values.keyVaultCSI.secretProviderClass }}
        {{- end }}
      {{- end }}
{{- if $svc.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "d.name" $ }}-{{ $name }}
spec:
  type: ClusterIP
  selector: {app: {{ include "d.name" $ }}-{{ $name }}}
  ports: [{port: {{ $svc.port }}, targetPort: {{ $svc.port }}}]
{{- end }}
{{- end }}
{{- end }}
