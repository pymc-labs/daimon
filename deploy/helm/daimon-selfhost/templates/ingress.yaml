{{- if .Values.ingress.enabled }}
{{- range $name := list "teams" "mcp" }}
{{- if (index $.Values.services $name).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "d.name" $ }}-{{ $name }}
  {{- $annotations := deepCopy $.Values.ingress.annotations }}
  {{- if eq $name "mcp" }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/backend-protocol" "HTTPS" }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/proxy-ssl-verify" "on" }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/proxy-ssl-server-name" "on" }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/proxy-ssl-name" (printf "%s-mcp" (include "d.name" $)) }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/proxy-ssl-secret" (printf "%s/%s" $.Release.Namespace (include "d.mcpTLSSecret" $)) }}
  {{- $annotations = mergeOverwrite $annotations $.Values.ingress.mcpAnnotations }}
  {{- end }}
  annotations: {{ $annotations | toJson }}
spec:
  {{- if $.Values.ingress.className }}
  ingressClassName: {{ $.Values.ingress.className }}
  {{- end }}
  {{- if $.Values.ingress.tls }}
  tls: {{ $.Values.ingress.tls | toJson }}
  {{- end }}
  rules:
    - host: {{ index $.Values.ingress (printf "%sHost" $name) }}
      http:
        paths:
          {{- $paths := list "/" }}
          {{- if eq $name "teams" }}{{ $paths = list "/api/messages" "/api/graph/notifications" "/api/graph/lifecycle" }}{{ end }}
          {{- range $path := $paths }}
          - path: {{ $path }}
            pathType: {{ ternary "Exact" "Prefix" (eq $name "teams") }}
            backend:
              service:
                name: {{ include "d.name" $ }}-{{ $name }}
                port: {number: {{ (index $.Values.services $name).port }}}
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
