services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daimon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-daimon}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daimon}"]
      interval: 5s
      timeout: 3s
      retries: 10

  init:
    image: ${DAIMON_LANE_IMAGE:?DAIMON_LANE_IMAGE is required}
    labels:
      org.opencontainers.image.revision: ${DAIMON_LANE_SHA:?DAIMON_LANE_SHA is required}
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DAIMON_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-daimon}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-daimon}
      DAIMON_ANTHROPIC__API_KEY: ${DAIMON_ANTHROPIC__API_KEY:?DAIMON_ANTHROPIC__API_KEY is required}
    entrypoint: ["sh", "-c"]
    command: ["alembic upgrade head && daimon defaults apply"]
    restart: "no"

  mcp:
    image: ${DAIMON_LANE_IMAGE:?DAIMON_LANE_IMAGE is required}
    labels:
      org.opencontainers.image.revision: ${DAIMON_LANE_SHA:?DAIMON_LANE_SHA is required}
    depends_on:
      init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DAIMON_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-daimon}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-daimon}
      DAIMON_MCP__JWT_SECRET: ${DAIMON_MCP__JWT_SECRET:?DAIMON_MCP__JWT_SECRET is required}
      DAIMON_MCP__PUBLIC_URL: ${DAIMON_MCP__PUBLIC_URL:?DAIMON_MCP__PUBLIC_URL is required}
      DAIMON_ANTHROPIC__API_KEY: ${DAIMON_ANTHROPIC__API_KEY:?DAIMON_ANTHROPIC__API_KEY is required}
    entrypoint: ["uvicorn"]
    command: ["daimon.adapters.mcp.server:create_mcp_app", "--factory", "--host", "0.0.0.0", "--port", "8765"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8765/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  discord:
    image: ${DAIMON_LANE_IMAGE:?DAIMON_LANE_IMAGE is required}
    labels:
      org.opencontainers.image.revision: ${DAIMON_LANE_SHA:?DAIMON_LANE_SHA is required}
    depends_on:
      init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DAIMON_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-daimon}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-daimon}
      DAIMON_ANTHROPIC__API_KEY: ${DAIMON_ANTHROPIC__API_KEY:?DAIMON_ANTHROPIC__API_KEY is required}
    entrypoint: ["python", "-m", "daimon.adapters.discord"]
    restart: unless-stopped

  scheduler:
    image: ${DAIMON_LANE_IMAGE:?DAIMON_LANE_IMAGE is required}
    labels:
      org.opencontainers.image.revision: ${DAIMON_LANE_SHA:?DAIMON_LANE_SHA is required}
    depends_on:
      init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DAIMON_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-daimon}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-daimon}
      DAIMON_ANTHROPIC__API_KEY: ${DAIMON_ANTHROPIC__API_KEY:?DAIMON_ANTHROPIC__API_KEY is required}
      DAIMON_MCP__JWT_SECRET: ${DAIMON_MCP__JWT_SECRET:?DAIMON_MCP__JWT_SECRET is required}
      DAIMON_MCP__PUBLIC_URL: ${DAIMON_MCP__PUBLIC_URL:?DAIMON_MCP__PUBLIC_URL is required}
    entrypoint: ["daimon-scheduler"]
    restart: unless-stopped

  slack:
    image: ${DAIMON_LANE_IMAGE:?DAIMON_LANE_IMAGE is required}
    profiles: ["slack"]
    labels:
      org.opencontainers.image.revision: ${DAIMON_LANE_SHA:?DAIMON_LANE_SHA is required}
    depends_on:
      init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DAIMON_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-daimon}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-daimon}
      DAIMON_ANTHROPIC__API_KEY: ${DAIMON_ANTHROPIC__API_KEY:?DAIMON_ANTHROPIC__API_KEY is required}
      DAIMON_MCP__PUBLIC_URL: ${DAIMON_MCP__PUBLIC_URL:?DAIMON_MCP__PUBLIC_URL is required}
    entrypoint: ["python", "-m", "daimon.adapters.slack"]
    restart: unless-stopped

  watch-executor:
    profiles: ["preview-sidecar"]
    image: ${DAIMON_LANE_IMAGE:?DAIMON_LANE_IMAGE is required}
    labels:
      org.opencontainers.image.revision: ${DAIMON_LANE_SHA:?DAIMON_LANE_SHA is required}
    depends_on:
      init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DAIMON_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-daimon}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-daimon}
      DAIMON_WATCHES__ENABLED: ${DAIMON_WATCHES__ENABLED:-false}
      DAIMON_WATCHES__EXECUTOR_SECRET: ${DAIMON_WATCHES__EXECUTOR_SECRET:-}
    # Private service only: no published ports, public proxy route or MCP tools.
    entrypoint: ["uvicorn"]
    command: ["daimon.adapters.mcp.watch_executor:create_watch_executor_app", "--factory", "--host", "0.0.0.0", "--port", "8767", "--no-access-log"]
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  sidecar:
    profiles: ["preview-sidecar"]
    image: ${DAIMON_LANE_IMAGE:?DAIMON_LANE_IMAGE is required}
    labels:
      org.opencontainers.image.revision: ${DAIMON_LANE_SHA:?DAIMON_LANE_SHA is required}
    depends_on:
      init:
        condition: service_completed_successfully
    # No env_file: source ingress receives neither provider nor vault credentials.
    environment:
      DAIMON_SIDECAR__DATABASE_URL: ${DAIMON_SIDECAR__DATABASE_URL:-postgresql+asyncpg://sidecar:unconfigured@postgres:5432/daimon}
      DAIMON_WATCHES__ENABLED: ${DAIMON_WATCHES__ENABLED:-false}
      DAIMON_SIDECAR__SIGNING_KEYS: "${DAIMON_SIDECAR__SIGNING_KEYS:-{}}"
      DAIMON_SIDECAR__EXECUTOR_SECRET: ${DAIMON_WATCHES__EXECUTOR_SECRET:-}
      DAIMON_SIDECAR__OS_EXECUTOR_ORIGIN: "http://watch-executor:8767"
      DAIMON_SIDECAR__POLL_INTERVAL_S: "5"
      DAIMON_SIDECAR__PORT: "8780"
      DAIMON_SIDECAR__MAX_CONCURRENT: "8"
      DAIMON_SIDECAR__REQUEST_TIMEOUT_S: "10"
    entrypoint: ["daimon-sidecar"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8780/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  sidecar-proxy:
    profiles: ["preview-sidecar"]
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    depends_on:
      sidecar:
        condition: service_healthy
    environment:
      DAIMON_SIDECAR_PUBLIC_HOST: ${DAIMON_SIDECAR_PUBLIC_HOST:-localhost}
    ports: ["${DAIMON_SIDECAR_TLS_PORT:-443}:443"]
    volumes:
      - ./Caddyfile.sidecar:/etc/caddy/Caddyfile:ro
      - sidecar_proxy_data:/data
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    restart: unless-stopped

  wipe:
    image: ${DAIMON_LANE_IMAGE:?DAIMON_LANE_IMAGE is required}
    profiles: ["ops"]
    labels:
      org.opencontainers.image.revision: ${DAIMON_LANE_SHA:?DAIMON_LANE_SHA is required}
    env_file: .env
    entrypoint: ["python", "-m", "daimon.adapters.cli.lane_wipe"]
    command: ["wipe"]
    restart: "no"

  preview-parity-mcp:
    image: ${DAIMON_LANE_IMAGE:?DAIMON_LANE_IMAGE is required}
    profiles: ["preview-parity"]
    labels:
      org.opencontainers.image.revision: ${DAIMON_LANE_SHA:?DAIMON_LANE_SHA is required}
    environment:
      # No lane DB, model credentials or other secrets enter this fixture.
      PYTHONPATH: /app/packages/testing
      DAIMON_PARITY_LANE: ${DAIMON_PARITY_LANE:-disabled}
      DAIMON_PREVIEW_PARITY_MCP_TOKEN: ${DAIMON_PREVIEW_PARITY_MCP_TOKEN:-}
      DAIMON_PARITY_CALL_LOG: /home/daimon/calls.jsonl
    entrypoint: ["uvicorn"]
    command: ["daimon.testing.preview_parity_mcp:create_app", "--factory", "--host", "0.0.0.0", "--port", "8766", "--workers", "1", "--no-access-log"]
    ports: ["127.0.0.1:18766:8766"]
    volumes:
      - preview-parity-calls:/home/daimon
    restart: unless-stopped


  preview-notebook:
    profiles: ["preview-notebook"]
    # The workflow resolves this variable before handing compose to the host CLI.
    image: ${DAIMON_NOTEBOOK_IMAGE:-notebook-host:unconfigured}
    labels:
      org.opencontainers.image.revision: ${DAIMON_LANE_SHA:?DAIMON_LANE_SHA is required}
    # Explicit allowlist: no DB, model, Discord or other lane credentials.
    environment:
      DAIMON_NOTEBOOK__ADMIN_SECRET: ${DAIMON_NOTEBOOK__ADMIN_SECRET:-}
      DAIMON_NOTEBOOK__PUBLIC_HOST: ${DAIMON_NOTEBOOK__PUBLIC_HOST:-localhost}
      DAIMON_NOTEBOOK__PUBLIC_URL_BASE: ${DAIMON_NOTEBOOK__PUBLIC_URL_BASE:-}
      DAIMON_NOTEBOOK__TENANTS: ${DAIMON_NOTEBOOK__TENANTS:-}
      DAIMON_NOTEBOOK__ALLOWED_ORIGINS: ${DAIMON_NOTEBOOK__ALLOWED_ORIGINS:-}
    volumes:
      - preview-notebooks:/data/notebooks
    # Default lane network, also used by preview-parity-mcp and lanes-caddy.
    # Retain image root + Docker's default SETUID/SETGID capabilities for the jail.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8001/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    mem_limit: 768m
    cpus: 0.5
    restart: unless-stopped

volumes:
  pgdata:
  preview-parity-calls:
  sidecar_proxy_data:
  preview-notebooks:
