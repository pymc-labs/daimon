# Install both hook types with a plain `pre-commit install` (setup script
# relies on this) so the commit-msg gate below is active for everyone.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # syrupy's block-scalar serializer indents every physical line of a
        # multi-line string value, including blank paragraph-break lines —
        # stripping that indentation here desyncs the committed snapshot
        # from what a bare test run (re)generates, breaking the test the
        # next time it runs without --snapshot-update.
        exclude: (^|/)__snapshots__/.*\.ambr$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      # Run ruff from the uv environment so the hook always matches the
      # project-pinned version. A remote ruff-pre-commit pin drifts: at
      # v0.7.4 vs project ruff 0.15.x it enforced since-removed rules
      # (UP038) and its --fix rewrote hundreds of files CI considers clean.
      # --force-exclude keeps pyproject extend-exclude effective for the
      # explicit paths pre-commit passes.
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]

      # pass_filenames must stay false: passing paths overrides the
      # [tool.pyright] include scope and drags tests/ + scripts/
      # (~1200 ungated errors) into the commit gate. With no args this is
      # exactly the CI invocation.
      - id: pyright
        name: pyright
        entry: env PYRIGHT_PYTHON_IGNORE_WARNINGS=1 uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-discord-modals
        name: lint discord modals
        entry: uv run python scripts/lint_discord_modals.py
        language: system
        pass_filenames: false
        files: ^packages/adapters/discord/.*\.py$

      - id: lint-anti-patterns
        name: lint test anti-patterns
        entry: bash scripts/lint_anti_patterns.sh
        language: system
        pass_filenames: false
        files: ^packages/.*/tests/.*\.py$

      - id: lint-migrations
        name: lint migration downgrade markers
        entry: uv run python scripts/lint_migrations.py
        language: system
        pass_filenames: false
        files: ^packages/core/alembic/versions/.*\.py$

      - id: lint-designators
        name: lint companion-repo leakage
        entry: bash scripts/lint_designators.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: env-example-check
        name: env example up to date
        entry: uv run python scripts/generate_env_example.py --check
        language: system
        pass_filenames: false
        files: ^(packages/core/daimon/core/config\.py|packages/adapters/scheduler/daimon/adapters/scheduler/settings\.py|packages/core/daimon/core/billing\.py|\.env\.example|scripts/generate_env_example\.py|scripts/_settings_walk\.py)$

      - id: config-reference-check
        name: config reference up to date
        entry: uv run python scripts/generate_config_reference.py --check
        language: system
        pass_filenames: false
        files: ^(packages/core/daimon/core/config\.py|packages/adapters/scheduler/daimon/adapters/scheduler/settings\.py|packages/core/daimon/core/billing\.py|apps/notebook-host/src/notebook_host/config\.py|apps/report-host/src/report_host/config\.py|docker-compose\.yml|docs/configuration\.md|scripts/generate_config_reference\.py|scripts/_settings_walk\.py)$

      - id: mcp-tool-catalogue-check
        name: mcp tool catalogue up to date
        entry: uv run python scripts/generate_mcp_tool_catalogue.py --check
        language: system
        pass_filenames: false
        files: ^(packages/adapters/mcp/daimon/adapters/mcp/(tools/.*\.py|server\.py|hub/app\.py)|docs/mcp-tools\.md|scripts/generate_mcp_tool_catalogue\.py)$
