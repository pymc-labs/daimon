<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
/* PyMC Labs dashboard — FROZEN style block. Palette hexes only (non-negotiable 2):
   edit content, not these tokens. Lighten/darken via rgba() alpha, never a new hex. */
:root{
  --navy:#0C1F40; --navy-deep:#07142A; --navy-header:#071530;
  --aqua:#B4E7DD; --periwinkle:#9FAAE2; --peach:#F6AE72; --violet:#C8B4E7;
  --soft-white:#F7F7F7; --white:#FFFFFF;
  --teal:#0C9E82; --indigo:#5462C4; --dark-orange:#C4720A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",sans-serif;font-weight:400;color:var(--navy);background:var(--white);font-size:18px;line-height:1.55}
header.pymc{max-width:1180px;margin:0 auto;padding:28px 28px 8px}
header.pymc img{height:20px;display:block;margin-bottom:24px}
header.pymc .htitle{display:block;font-weight:600;font-size:32px;line-height:1.2;letter-spacing:-.02em}
header.pymc .hsub{display:block;font-size:18px;margin-top:8px;color:rgba(12,31,64,.72)}
nav.tabs{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:4px;padding:0 28px;border-bottom:1px solid rgba(12,31,64,.16)}
nav.tabs button{font-family:inherit;font-size:16px;font-weight:500;color:var(--navy);background:none;border:none;border-bottom:2px solid transparent;padding:12px 12px 10px;cursor:pointer}
nav.tabs button.active{color:var(--indigo);border-bottom-color:var(--indigo)}
main{max-width:1180px;margin:0 auto;padding:26px 28px 60px}
section.tab{display:none}
section.tab.active{display:block}
h2{font-weight:600;font-size:26px;letter-spacing:-.015em;margin:8px 0 8px}
h3{font-weight:600;font-size:20px;margin:28px 0 8px}
p.lede{font-size:19px;max-width:72ch;margin-bottom:18px}
/* key numbers: .keynums > .keynum, a plain row with rules (no cards) */
.keynums{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 28px;margin:18px 0;border-top:2px solid var(--navy);border-bottom:1px solid rgba(12,31,64,.16)}
.keynum{padding:12px 0}
.keynum .knum{font-weight:600;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.keynum .klabel{font-size:15px;color:rgba(12,31,64,.72);margin-top:2px}
.keynum .kci{font-size:15px;color:rgba(12,31,64,.72);margin-top:2px}
/* .status: plain status text, never a pill */
.status{font-weight:600}
.panel{margin:18px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:16px;border-top:2px solid var(--navy);border-bottom:2px solid var(--navy)}
th{font-weight:600;text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--navy)}
td{padding:7px 10px 7px 0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:15px;color:rgba(12,31,64,.72);max-width:78ch;margin-top:6px}
code{font-family:"JetBrains Mono",monospace;font-size:.85em;background:var(--soft-white);padding:1px 4px}
footer{max-width:1180px;margin:0 auto;padding:18px 28px;font-size:15px;color:rgba(12,31,64,.72);border-top:1px solid rgba(12,31,64,.16)}
select,input[type=range]{accent-color:var(--indigo);font-family:inherit;font-size:16px}
@media(max-width:600px){header.pymc .htitle{font-size:26px}main,header.pymc,nav.tabs,footer{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<header class="pymc">
  <img src="data:image/png;base64,{{LOGO_B64}}" alt="PyMC Labs">
  <h1 class="htitle">{{TITLE}}</h1>
  <p class="hsub">{{SUBTITLE}}</p>
</header>
<nav class="tabs" id="tabs"><!-- one <button data-tab="…"> per section --></nav>
<main id="main">
{{CONTENT}}
</main>
<footer>{{FOOTER}}</footer>
<script>
const tabs=document.getElementById('tabs');
document.querySelectorAll('section.tab').forEach((s,i)=>{
  const b=document.createElement('button');
  b.textContent=s.dataset.title;b.dataset.tab=s.id;
  if(i===0){b.classList.add('active');s.classList.add('active');}
  b.onclick=()=>{document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('section.tab').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');s.classList.add('active');
    window.dispatchEvent(new Event('resize'));};
  tabs.appendChild(b);
});
/* Plotly house defaults — pass PYMC_LAYOUT/PYMC_CONFIG to every Plotly.newPlot */
const C={navy:'#0C1F40',aqua:'#B4E7DD',periwinkle:'#9FAAE2',peach:'#F6AE72',violet:'#C8B4E7',
teal:'#0C9E82',indigo:'#5462C4',darkOrange:'#C4720A',softWhite:'#F7F7F7',white:'#FFFFFF'};
const PYMC_SERIES=[C.navy,C.teal,C.periwinkle,C.peach,C.violet,C.indigo];
const PYMC_LAYOUT={font:{family:'Inter',color:C.navy,size:14},colorway:PYMC_SERIES,
paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',
xaxis:{gridcolor:'rgba(12,31,64,.10)',zerolinecolor:'rgba(12,31,64,.3)',linecolor:'#0C1F40'},
yaxis:{gridcolor:'rgba(12,31,64,.10)',zerolinecolor:'rgba(12,31,64,.3)',linecolor:'#0C1F40'},
margin:{t:36,r:18,b:48,l:96},hoverlabel:{font:{family:'Inter'}}};
const PYMC_CONFIG={displayModeBar:false,responsive:true};
</script>
{{SCRIPTS}}
</body>
</html>
