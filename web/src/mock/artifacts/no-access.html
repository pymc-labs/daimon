<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>No access</title>
<style>
:root{--bg:#f5f7f9;--card:#fff;--ink:#0c1f40;--mute:#55627a;--line:#e2e6ec;--strong:#ccd3dd}
@media(prefers-color-scheme:dark){:root{--bg:#0a1931;--card:#071428;--ink:#edf1f6;--mute:#9ca9bf;--line:#1b2c4b;--strong:#2a3c5f}}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:12vh 24px 24px;background:var(--bg);color:var(--ink);font:14px/1.5 "Inter Variable",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:400px;padding:32px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgb(0 0 0/.04)}
img{width:48px;height:48px;object-fit:contain}h1{margin:20px 0 0;font-size:18px;font-weight:600;line-height:1.4}p{margin:6px 0 0;color:var(--mute)}
a.b{display:flex;align-items:center;justify-content:center;height:40px;margin-top:24px;border:1px solid var(--strong);border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}a.b:hover{background:var(--bg)}
</style></head><body><div class="card"><img src="/daimon.png" alt=""><h1>No access</h1><p>Ask the owner to share it with you.</p><a class="b" href="/signin">Sign in with another account</a></div></body></html>
