[project]
name = "report-host"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "PyMC Labs" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    # Pinned below 2.0: mcp_client.py unpacks streamable_http_client's
    # context-manager result, and 2.x changed that from a 3-tuple
    # (read, write, get_session_id) to a 2-tuple (read, write). Lift the
    # pin once mcp_client.py is updated for the 2.x shape.
    "mcp>=1.27,<2",
]

[project.urls]
Repository = "https://github.com/pymc-labs/daimon"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report_host"]
