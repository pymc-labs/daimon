[project]
name = "daimon-eval-sandbox"
version = "0.1.0"
description = "Enclosed sandbox image for Daimon evals"
requires-python = ">=3.12"
dependencies = ["mitmproxy==12.3.1", "httpx>=0.28", "anthropic>=0.117,<1", "daimon-harness"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daimon_eval_sandbox"]
