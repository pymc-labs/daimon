# Example Fly config for the notebook host. Copy to a per-deployment file
# (e.g. fly.notebook.toml) and substitute the placeholders below before
# `fly deploy`. Do NOT commit your edited copy — gitignore it locally or
# keep it in a private overlay.
#
# Required substitutions:
#   <your-app-name>          Fly app name (e.g. acme-daimon-notebook-host)
#   <your-app-name>.fly.dev  Public hostname the bot returns in URLs
#
# Naming convention: prefix the environment, don't suffix it
# (e.g. production-daimon-notebook-host, staging-daimon-notebook-host).
#
# PUBLIC EXPOSURE: the [[services]] block below publishes the host, because
# users open notebook links in a browser. Each notebook is protected by the
# access token in its link and served from its own origin,
# https://<label>.<your-notebook-domain>/ (see the README's trust model).
# That needs, before deploying:
#   - a wildcard DNS record: *.<your-notebook-domain> CNAME <your-app-name>.fly.dev
#     (plus <your-notebook-domain> itself for the upload URL, if you like)
#   - a wildcard certificate:
#       fly certs add "*.<your-notebook-domain>" --app <your-app-name>
# Without ORIGIN_BASE all notebooks share one origin with no browser
# isolation, and the host admits a single tenant.

app = "<your-app-name>"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  DAIMON_NOTEBOOK__HOST_PORT = "8001"
  DAIMON_NOTEBOOK__DATA_DIR = "/data/notebooks"
  # PUBLIC_HOST is the hostname embedded in URLs the bot returns to users.
  # Leaving the placeholder here will produce broken URLs in chat —
  # substitute before deploying.
  DAIMON_NOTEBOOK__PUBLIC_HOST = "<your-app-name>.fly.dev"
  # Links carry the notebook's access token, so they must be https: without
  # this they come out as http://<host>:8001/... in plaintext.
  DAIMON_NOTEBOOK__PUBLIC_URL_BASE = "https://<your-app-name>.fly.dev"
  # One origin per notebook: links become https://<label>.<this>/n/<slug>/.
  # Needs the wildcard DNS record and certificate above.
  DAIMON_NOTEBOOK__ORIGIN_BASE = "<your-notebook-domain>"
  # DAIMON_NOTEBOOK__ADMIN_SECRET must be set via:
  #   fly secrets set DAIMON_NOTEBOOK__ADMIN_SECRET=<secret> --app <your-app-name>
  # Never commit the secret value here.

[[services]]
  internal_port = 8001
  protocol = "tcp"
  auto_start_machines = true

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[mounts]]
  source = "notebook_data"
  destination = "/data"

[[vm]]
  memory_mb = 4096
  cpu_kind = "shared"
  cpus = 2
