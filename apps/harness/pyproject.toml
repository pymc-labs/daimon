[project]
name = "daimon-harness"
version = "0.1.0"
description = "Self-hosted Daimon agent harness"
requires-python = ">=3.12"
dependencies = [
    "daimon-mux", "fastapi>=0.115", "uvicorn>=0.34",
    "openai-agents==0.20.0", "openai>=2.54,<3", "azure-identity>=1.25", "aiohttp>=3.13.5,<4", "pyjwt[crypto]>=2.12",
]

[project.optional-dependencies]
data = [
    "numpy",
    "pandas",
    "pymc",
    "pymc-extras==0.7.0",
    "pymc-marketing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daimon_harness"]
